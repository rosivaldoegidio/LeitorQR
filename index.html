<!DOCTYPE html>
<html lang="pt-BR">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Teste API</title>

<style>
body{
    font-family:Arial;
    max-width:500px;
    margin:40px auto;
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:18px;
}

#resultado{
    margin-top:20px;
    font-weight:bold;
}
</style>

<script src="https://unpkg.com/html5-qrcode"></script>

</head>
<body>

<h2>Teste da API</h2>
<button onclick="abrirCamera()">
Abrir câmera
</button>

<div id="reader"></div>
<input
id="codigo"
placeholder="Digite um código">

<button onclick="enviar()">
Enviar
</button>

<div id="resultado"></div>

<script>

const URL_API = "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

async function enviar(){

    const codigo = document.getElementById("codigo").value;

    if(codigo==""){
        document.getElementById("resultado").innerHTML =
        "Digite um código.";
        return;
    }

    document.getElementById("resultado").innerHTML =
    "Enviando...";

    // Chamada usando GET
    const url =
    URL_API + "?codigo=" + encodeURIComponent(codigo);

    try{

        const resposta = await fetch(url);

        const texto = await resposta.text();

        document.getElementById("resultado").innerHTML =
        texto;

    }catch(e){

        document.getElementById("resultado").innerHTML =
        "ERRO: " + e;

    }

}

// ===== NOVA FUNÇÃO =====
let html5QrCode = null;

let ultimaLeitura = "";

function abrirCamera(){

    if(html5QrCode){
        return;
    }

    html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },

        async function(decodedText){

            // Evita ler o mesmo QR várias vezes
            if(decodedText === ultimaLeitura){
                return;
            }

            ultimaLeitura = decodedText;

            document.getElementById("resultado").innerHTML =
            "Enviando...";

            try{

                const resposta = await fetch(
                    URL_API +
                    "?codigo=" +
                    encodeURIComponent(decodedText)
                );

                const texto = await resposta.text();

                document.getElementById("resultado").innerHTML =
                texto;

            }catch(e){

                document.getElementById("resultado").innerHTML =
                "ERRO: " + e;

            }

        }

    );

}</script>

</body>
</html>
