<!DOCTYPE html>
<html lang="pt-BR">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>📦 Leitor de Etq. de Caixa</title>

<style>
body{
    font-family:Arial;
    max-width:500px;
    margin:40px auto;
    padding:20px;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:18px;
}

#resultado{
    margin-top:20px;
    font-weight:bold;
}
</style>

<script src="https://unpkg.com/html5-qrcode"></script>

</head>
<body>

<h2>📦 Leitor de Etq. de Caixa</h2>
<button onclick="abrirCamera()">
Abrir câmera
</button>

<div id="reader"></div>

<div id="resultado"></div>

<script>

const URL_API = "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

async function enviar(){

    const codigo = document.getElementById("codigo").value;

    if(codigo==""){
        document.getElementById("resultado").innerHTML =
        "Digite um código.";
        return;
    }

    document.getElementById("resultado").innerHTML =
    "Enviando...";

    // Chamada usando GET
    const url =
    URL_API + "?codigo=" + encodeURIComponent(codigo);

    try{

        const resposta = await fetch(url);

        const texto = await resposta.text();

        document.getElementById("resultado").innerHTML =
        texto;

    }catch(e){

        document.getElementById("resultado").innerHTML =
        "ERRO: " + e;

    }

}

// ===== NOVA FUNÇÃO =====
let html5QrCode = null;

let podeLer = true;

let temporizadorInatividade = null;

function confirmarLeitura(){

    // Bip
    const audio = new Audio(
      "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );

    audio.play().catch(()=>{});

    // Vibração
    if(navigator.vibrate){
        navigator.vibrate(200);
    }

}

function reiniciarTemporizador(){

    clearTimeout(temporizadorInatividade);

    temporizadorInatividade = setTimeout(async function(){

        try{

            if(html5QrCode){

    await html5QrCode.stop();

    html5QrCode.clear();

    html5QrCode = null;

    document.getElementById("reader").innerHTML = "";

}

            document.getElementById("resultado").innerHTML =
            "Câmera desligada por inatividade.";

        }catch(e){}

    },60000); // 60 segundos

}    
    
function abrirCamera(){

    if(html5QrCode){
        return;
    }

    html5QrCode = new Html5Qrcode("reader");

    iniciarLeitura();

 reiniciarTemporizador();
    
}

function iniciarLeitura(){

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },

        async function(decodedText){

            if(!podeLer){
    return;
}

podeLer = false;

// Bip e vibração imediatamente ao reconhecer o QR
confirmarLeitura();

reiniciarTemporizador();            

document.getElementById("resultado").innerHTML =
"Enviando...";

try{

                const resposta = await fetch(
    URL_API +
    "?codigo=" +
    encodeURIComponent(decodedText)
);

const texto = await resposta.text();

document.getElementById("resultado").innerHTML =
texto;

                // Para a câmera
await html5QrCode.stop();

// Libera nova leitura
podeLer = true;

// Aguarda 2 segundos antes de reabrir
setTimeout(function(){

    if(html5QrCode){

        iniciarLeitura();

        reiniciarTemporizador();

    }

},2000);

},2000);

            }catch(e){

                document.getElementById("resultado").innerHTML =
                "ERRO: " + e;

                try{
                    await html5QrCode.stop();
                }catch(err){}

                podeLer = true;

setTimeout(function(){

    if(html5QrCode){

        iniciarLeitura();

        reiniciarTemporizador();

    }

},2000);

            }

        }

    );

}
</script>

</body>
</html>
