<!DOCTYPE html>
<html lang="pt-BR">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
   
<title>📦 Leitor de Etq. de Caixa</title>

<style>
body{
    font-family:Arial;
    max-width:500px;
    margin:40px auto;
    padding:20px;
   
}

h2{
    margin:10px 0 20px 0;
    text-align:center;
    color:#333;
    font-size:28px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
}
button{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:18px;
}

#resultado{
    margin-top:20px;
    font-weight:bold;
}
</style>

<script src="https://unpkg.com/html5-qrcode"></script>

</head>
<body>

<div style="text-align:center; margin-bottom:15px;">
    <img src="logo.png" width="160" alt="Logo">
    <h2>📦 Leitor de Etq. de Caixa</h2>
</div>
   
   <label><b>Setor:</b></label>

<select id="setor" style="width:100%; padding:12px; font-size:18px; margin-bottom:15px;">
    <option value="">Selecione o setor</option>
    <option value="Corte">Corte</option>
    <option value="Costura">Costura</option>
    <option value="Dobra">Dobra</option>
    <option value="Pacote">Pacote</option>
</select>
   
<button onclick="abrirCamera()">
Abrir câmera
</button>

<div id="reader"></div>

<div id="setores" style="display:none; text-align:center; margin-top:20px;">

    <h3>Selecione o setor</h3>

    <button onclick="enviarSetor('Corte')">Corte</button>

    <button onclick="enviarSetor('Costura')">Costura</button>

    <button onclick="enviarSetor('Dobra')">Dobra</button>

    <button onclick="enviarSetor('Pacote')">Pacote</button>

</div>

<div id="resultado"></div>

<script>

const URL_API = "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

async function enviar(){

    const codigo = document.getElementById("codigo").value;

    if(codigo==""){
        document.getElementById("resultado").innerHTML =
        "Digite um código.";
        return;
    }

    document.getElementById("resultado").innerHTML =
    "Enviando...";

    // Chamada usando GET
    const url =
    URL_API + "?codigo=" + encodeURIComponent(codigo);

    try{

        const resposta = await fetch(url);

        const texto = await resposta.text();

        document.getElementById("resultado").innerHTML =
        texto;

    }catch(e){

        document.getElementById("resultado").innerHTML =
        "ERRO: " + e;

    }

}

// ===== NOVA FUNÇÃO =====
let html5QrCode = null;

let podeLer = true;

let temporizadorInatividade = null;

// Controle de leitura duplicada
let ultimoCodigo = "";
let ultimoHorario = 0;

function confirmarLeitura(){

    // Bip
    const audio = new Audio(
      "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );

    audio.play().catch(()=>{});

    // Vibração
    if(navigator.vibrate){
        navigator.vibrate(200);
    }

}

function confirmarSucesso(){

    const audio = new Audio(
      "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
    );

    audio.play().catch(()=>{});

}

function reiniciarTemporizador(){

    clearTimeout(temporizadorInatividade);

    temporizadorInatividade = setTimeout(async function(){

        try{

            if(html5QrCode){

    await html5QrCode.stop();

       html5QrCode = null;

    document.getElementById("reader").innerHTML = "";

}

            document.getElementById("resultado").innerHTML =
            "Câmera desligada por inatividade.";

        }catch(e){}

    },60000); // 60 segundos

}    
    
function abrirCamera(){

    const setor = document.getElementById("setor").value;

    if(setor == ""){
        alert("Selecione o setor antes de abrir a câmera.");
        return;
    }

    if(html5QrCode){
        return;
    }

    html5QrCode = new Html5Qrcode("reader");

    iniciarLeitura();

    reiniciarTemporizador();

}

function iniciarLeitura(){

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },

        async function(decodedText){

    // Verifica se é a mesma etiqueta lida há menos de 2 segundos
    const agora = Date.now();

    if(decodedText === ultimoCodigo && (agora - ultimoHorario) < 2000){

        document.getElementById("resultado").innerHTML =
        "⚠ Etiqueta já lida. Aguarde 2 segundos.";

        return;
    }

    if(!podeLer){
        return;
    }

    podeLer = false;

const setor = document.getElementById("setor").value;

if(setor == ""){

    alert("Selecione o setor.");

    podeLer = true;

    return;
}

// Bip e vibração imediatamente ao reconhecer o QR
confirmarLeitura();

reiniciarTemporizador();            

document.getElementById("resultado").innerHTML =
"Enviando...";

try{

const resposta = await fetch(
    URL_API +
    "?codigo=" + encodeURIComponent(decodedText) +
    "&setor=" + encodeURIComponent(setor)
);

const texto = await resposta.text();

document.getElementById("resultado").innerHTML =
texto;

if(texto.startsWith("OK")){

    confirmarSucesso();

    // Guarda somente após sucesso
    ultimoCodigo = decodedText;
    ultimoHorario = agora;

}
                // Para a câmera
await html5QrCode.stop();

// Libera nova leitura
podeLer = true;

// Aguarda 2 segundos antes de reabrir
setTimeout(function(){

           iniciarLeitura();

        reiniciarTemporizador();

    },2000);

            }catch(e){

                document.getElementById("resultado").innerHTML =
                "ERRO: " + e;

                try{
                    await html5QrCode.stop();
                }catch(err){}

                podeLer = true;

setTimeout(function(){

           iniciarLeitura();

        reiniciarTemporizador();

    },2000);

            }

        }

    );

}
</script>

</body>
</html>
