<!DOCTYPE html>
<html lang="pt-BR">  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
   
<title>📦 Leitor de Etq. de Caixa</title>

<style>
body{
    font-family:Arial;
    max-width:500px;
    margin:40px auto;
    padding:20px;
   
}

h2{
    margin:10px 0 20px 0;
    text-align:center;
    color:#333;
    font-size:28px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
}
button{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:18px;
}

#resultado{
    margin-top:20px;
    font-weight:bold;
}
</style>

<script src="https://unpkg.com/html5-qrcode"></script>

</head>
<body>

<div id="telaSenha" style="
    position:fixed;
    inset:0;
    background:white;
    z-index:99999;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
">

    <div style="
        width:100%;
        max-width:350px;
        text-align:center;
        font-family:Arial;
    ">

        <h2>🔐 Acesso ao Leitor</h2>

        <p>Digite a senha para continuar</p>

        <input
            id="senhaAcesso"
            type="password"
            placeholder="Senha"
            autocomplete="off"
            style="
                width:100%;
                box-sizing:border-box;
                padding:14px;
                font-size:18px;
                text-align:center;
            "
        >

        <button
            onclick="entrarSistema()"
            style="
                width:100%;
                margin-top:15px;
                padding:14px;
                font-size:18px;
            "
        >
            ENTRAR
        </button>

        <div
            id="erroSenha"
            style="
                margin-top:15px;
                color:red;
                font-weight:bold;
            "
        ></div>

    </div>

</div>

<div style="text-align:center; margin-bottom:15px;">
    <img src="logo.png" width="160" alt="Logo">
    <h2>📦 Leitor de Etq. de Caixa</h2>
</div>
   
   <label><b>Setor:</b></label>

<select id="setor" style="width:100%; padding:12px; font-size:18px; margin-bottom:15px;">
    <option value="">Selecione o setor</option>
    <option value="Corte">Corte</option>
    <option value="Costura">Costura</option>
    <option value="Dobra">Dobra</option>
    <option value="Pacote">Pacote</option>
</select>

<div id="opcaoCorte" style="display:none; margin-bottom:15px;">

    <label><b>Etapa:</b></label>

    <select id="tipoCorte" style="width:100%; padding:12px; font-size:18px;">
        <option value="">Selecione</option>
        <option value="producao">Produção</option>
        <option value="embalagem">Embalagem</option>
    </select>

</div>

<div id="campoLote" style="display:none; margin-bottom:15px;">

    <label><b>Lote:</b></label>

    <input
        id="loteManual"
        type="text"
        placeholder="Digite o lote">

</div>

<button onclick="abrirCamera()">
Abrir câmera
</button>

<div id="reader"></div>

<div id="setores" style="display:none; text-align:center; margin-top:20px;">

    <h3>Selecione o setor</h3>

    <button onclick="enviarSetor('Corte')">Corte</button>

    <button onclick="enviarSetor('Costura')">Costura</button>

    <button onclick="enviarSetor('Dobra')">Dobra</button>

    <button onclick="enviarSetor('Pacote')">Pacote</button>

</div>

<div id="resultado"></div>

<script>

const SENHA_ACESSO = "PIONG2026@";

function entrarSistema(){

    const senha =
        document.getElementById("senhaAcesso").value;

    const erro =
        document.getElementById("erroSenha");

    if(senha === SENHA_ACESSO){

        document.getElementById("telaSenha").style.display = "none";

    }else{

        erro.innerHTML = "❌ Senha incorreta";
        document.getElementById("senhaAcesso").value = "";
        document.getElementById("senhaAcesso").focus();

    }
}

const URL_API = "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

const audioLeitura = new Audio("./Audio_Leitura_Caixa.wav");

const audioSucesso = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");

const audioErro = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");

const audioMeta = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

// Mostra opções extras quando o setor é Corte
document.getElementById("setor").addEventListener("change", async function(){

    const opcaoCorte = document.getElementById("opcaoCorte");
    const campoLote = document.getElementById("campoLote");

   await fecharCamera();

    // Se mudou para Corte ou saiu de Corte
    if(this.value === "Corte" || this.value === "Costura"){

    opcaoCorte.style.display = "block";

}else{

    opcaoCorte.style.display = "none";
    campoLote.style.display = "none";

    document.getElementById("tipoCorte").value = "";
    document.getElementById("loteManual").value = "";

}

    // // Fechar câmera ao trocar de setor
    if(this.value === "Corte" || this.value === "Costura"){

    await fecharCamera();

}

if(this.value === "Dobra" || this.value === "Pacote"){

    await abrirCamera();

}
});

document.getElementById("tipoCorte").addEventListener("change", async function(){

    const campoLote = document.getElementById("campoLote");

    if(this.value === "producao"){

        // Fecha a câmera ao voltar para Produção
        await fecharCamera();

        campoLote.style.display = "block";

        document.getElementById("loteManual").focus();

    }else if(this.value === "embalagem"){

        campoLote.style.display = "none";

        if(!html5QrCode){
            abrirCamera();
        }

    }else{

        campoLote.style.display = "none";

        await fecharCamera();

    }

});
document.getElementById("loteManual").addEventListener("keypress", async function(e){

    if(e.key !== "Enter"){
        return;
    }

    e.preventDefault();

    const lote = this.value.trim();

    if(lote === ""){
        return;
    }

const quantidade = prompt("Digite a quantidade produzida:", "1");

if(
    quantidade === null ||
    quantidade.trim() === "" ||
    isNaN(quantidade)
){
    document.getElementById("resultado").innerHTML =
    "Operação cancelada.";
    return;
}
   
    document.getElementById("resultado").innerHTML =
    "Enviando lote...";

const setor = document.getElementById("setor").value;

const resposta = await fetch(
    URL_API +
    "?setor=" + encodeURIComponent(setor) +
    "&tipo=producao" +
    "&lote=" + encodeURIComponent(lote) +
    "&quantidade=" + encodeURIComponent(quantidade)
);

const texto = await resposta.text();

if(texto.startsWith("OK|")){

    const partes = texto.split("|");

    const linha = partes[1];
    const lote = partes[2];
   
    document.getElementById("resultado").innerHTML =
        "✅ Leitura OK!<br><br>" +
        "📦 Lote: " + lote + "<br>" +
        "📍 Linha: C" + linha;

   confirmarLeitura();

this.value = "";

this.focus();

}else{

    document.getElementById("resultado").innerHTML = texto;

}
   
});
   
async function enviar(){

    const codigo = document.getElementById("codigo").value;

    if(codigo==""){
        document.getElementById("resultado").innerHTML =
        "Digite um código.";
        return;
    }

    document.getElementById("resultado").innerHTML =
    "Enviando...";

    // Chamada usando GET
    const url =
URL_API + "?codigo=" + encodeURIComponent(codigo);

try{

    const resposta = await fetch(url);

    const texto = await resposta.text();

if(texto.startsWith("OK|")){

    const partes = texto.split("|");

    const linha = partes[1];
    const lote = partes[2];

    document.getElementById("resultado").innerHTML =
    "✅ Leitura OK!<br><br>" +
        "📦 Lote: " + lote + "<br>" +
        "📍 Linha: C" + linha;

    confirmarLeitura();

}else{

    document.getElementById("resultado").innerHTML = texto;

}

    }catch(e){

        document.getElementById("resultado").innerHTML =
        "ERRO: " + e;

    }

}

// ===== NOVA FUNÇÃO =====
let html5QrCode = null;

let podeLer = true;

let temporizadorInatividade = null;

// Controle de leitura duplicada
let ultimoCodigo = "";
let ultimoHorario = 0;

function confirmarLeitura(){

    audioLeitura.pause();
    audioLeitura.currentTime = 0;

    audioLeitura.play().catch(()=>{});

    if(navigator.vibrate){
        navigator.vibrate(200);
    }

}

function confirmarSucesso(){

    audioSucesso.pause();
    audioSucesso.currentTime = 0;

    audioSucesso.play().catch(()=>{});

}

function confirmarErro(){

    audioErro.pause();
    audioErro.currentTime = 0;

    audioErro.play().catch(()=>{});

    if(navigator.vibrate){
        navigator.vibrate([150,100,150]);
    }

}

function confirmarMeta(){

    audioMeta.pause();
    audioMeta.currentTime = 0;

    audioMeta.play().catch(()=>{});

    setTimeout(function(){
        audioMeta.currentTime = 0;
        audioMeta.play().catch(()=>{});
    },300);

    setTimeout(function(){
        audioMeta.currentTime = 0;
        audioMeta.play().catch(()=>{});
    },600);

    if(navigator.vibrate){
        navigator.vibrate([250,120,250,120,250]);
    }

}

function reiniciarTemporizador(){

    clearTimeout(temporizadorInatividade);

    temporizadorInatividade = setTimeout(async function(){

        try{

            if(html5QrCode){

    await html5QrCode.stop();

       html5QrCode = null;

    document.getElementById("reader").innerHTML = "";

}

            document.getElementById("resultado").innerHTML =
            "Câmera desligada por inatividade.";

        }catch(e){}

    },60000); // 60 segundos

}    

async function fecharCamera(){

    if(!html5QrCode){
        return;
    }

    try{

        clearTimeout(temporizadorInatividade);

        await html5QrCode.stop();

        await html5QrCode.clear();

    }catch(e){
        console.log(e);
    }

    html5QrCode = null;

    document.getElementById("reader").innerHTML = "";

}

async function abrirCamera(){

   // Desbloqueia os áudios no iPhone
audioLeitura.play().then(() => {
    audioLeitura.pause();
    audioLeitura.currentTime = 0;
}).catch(()=>{});

audioSucesso.play().then(() => {
    audioSucesso.pause();
    audioSucesso.currentTime = 0;
}).catch(()=>{});

audioErro.play().then(() => {
    audioErro.pause();
    audioErro.currentTime = 0;
}).catch(()=>{});

    const setor = document.getElementById("setor").value;

   if(setor === "Corte" || setor === "Costura"){

    const tipo = document.getElementById("tipoCorte").value;

    if(tipo === ""){

        alert("Selecione Produção ou Embalagem.");

        return;

    }

    if(tipo === "producao"){

        document.getElementById("campoLote").style.display = "block";

        document.getElementById("reader").innerHTML = "";
        document.getElementById("resultado").innerHTML = "";
        document.getElementById("loteManual").focus();
        return;

    }

    // Se for Embalagem, continua normalmente e abre a câmera.
}

    if(setor == ""){
        alert("Selecione o setor antes de abrir a câmera.");
        return;
    }

    if(html5QrCode){
        return;
    }

    html5QrCode = new Html5Qrcode("reader");

    iniciarLeitura();

    reiniciarTemporizador();

}

function iniciarLeitura(){

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },

        async function(decodedText){

    // Verifica se é a mesma etiqueta lida há menos de 2 segundos
    const agora = Date.now();

    if(decodedText === ultimoCodigo && (agora - ultimoHorario) < 2000){

        document.getElementById("resultado").innerHTML =
        "⚠ Etiqueta já lida. Aguarde 2 segundos.";

        return;
    }

    if(!podeLer){
        return;
    }

    podeLer = false;

const setor = document.getElementById("setor").value;

if(setor == ""){

    alert("Selecione o setor.");

    podeLer = true;

    return;
}

// Bip e vibração imediatamente ao reconhecer o QR
confirmarLeitura();

reiniciarTemporizador();            

document.getElementById("resultado").innerHTML =
"Enviando...";

try{

const resposta = await fetch(
    URL_API +
    "?codigo=" + encodeURIComponent(decodedText) +
    "&setor=" + encodeURIComponent(setor)
);

const texto = await resposta.text();

if(texto.startsWith("OK|")){

    const partes = texto.split("|");

    const linha = partes[1];
    const lote = partes[2];

    document.getElementById("resultado").innerHTML =
        "✅ Leitura OK!<br><br>" +
        "📦 Lote: " + lote + "<br>" +
        "📍 Linha: C" + linha;

   if(partes.length >= 4 && partes[3] === "META"){

    document.getElementById("resultado").innerHTML =
    "🎉 <b>LOTE FINALIZADO!</b><br><br>" +
    "✅ Meta de caixas atingida.<br><br>" +
    "📦 Lote: " + lote + "<br>" +
    "📍 Linha: C" + linha;

    confirmarMeta();

}else{

    document.getElementById("resultado").innerHTML =
        "✅ Leitura OK!<br><br>" +
        "📦 Lote: " + lote + "<br>" +
        "📍 Linha: C" + linha;

    confirmarSucesso();

}

// Guarda somente após sucesso
ultimoCodigo = decodedText;
ultimoHorario = agora;

}else{

    document.getElementById("resultado").innerHTML = texto;

    confirmarErro();

}
                // Para a câmera
await html5QrCode.stop();

// Libera nova leitura
podeLer = true;

// Aguarda 2 segundos antes de reabrir
setTimeout(function(){

           iniciarLeitura();

        reiniciarTemporizador();

    },2000);

            }catch(e){

                document.getElementById("resultado").innerHTML =
                "ERRO: " + e;
   
   confirmarErro();

                try{
                    await html5QrCode.stop();
                }catch(err){}

                podeLer = true;

setTimeout(function(){

           iniciarLeitura();

        reiniciarTemporizador();

    },2000);

            }

        }

    );

}
</script>

</body>
</html>
