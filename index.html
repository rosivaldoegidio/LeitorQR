<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>📦 Leitor de Etq. de Caixa</title>

<style>

body{
    font-family:Arial;
    max-width:500px;
    margin:40px auto;
    padding:20px;
}

h2{
    margin:10px 0 20px 0;
    text-align:center;
    color:#333;
    font-size:28px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    font-size:18px;
}

#resultado{
    margin-top:20px;
    font-weight:bold;
}

</style>

<script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div style="text-align:center; margin-bottom:15px;">

    <img src="logo.png" width="160" alt="Logo">

    <h2>📦 Leitor de Etq. de Caixa</h2>

</div>

<label><b>Setor:</b></label>

<select id="setor" style="width:100%; padding:12px; font-size:18px; margin-bottom:15px;">

    <option value="">Selecione o setor</option>
    <option value="Corte">Corte</option>
    <option value="Costura">Costura</option>
    <option value="Dobra">Dobra</option>
    <option value="Pacote">Pacote</option>

</select>

<div id="opcaoCorte" style="display:none; margin-bottom:15px;">

    <label><b>Etapa:</b></label>

    <select id="tipoCorte" style="width:100%; padding:12px; font-size:18px;">

        <option value="">Selecione</option>
        <option value="producao">Produção</option>
        <option value="embalagem">Embalagem</option>

    </select>

</div>

<div id="campoLote" style="display:none; margin-bottom:15px;">

    <label><b>Lote:</b></label>

    <input
        id="loteManual"
        type="text"
        placeholder="Digite o lote">

</div>

<button onclick="abrirCamera()">
    Abrir câmera
</button>

<div id="reader"></div>

<div id="setores" style="display:none; text-align:center; margin-top:20px;">

    <h3>Selecione o setor</h3>

    <button onclick="enviarSetor('Corte')">Corte</button>
    <button onclick="enviarSetor('Costura')">Costura</button>
    <button onclick="enviarSetor('Dobra')">Dobra</button>
    <button onclick="enviarSetor('Pacote')">Pacote</button>

</div>

<div id="resultado"></div>

<script>

const URL_API =
"https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

const audioSucesso =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/pop.ogg"
);

const audioErro =
new Audio(
"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
);

const audioMeta =
new Audio(
"https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
);


// Mostra opções extras para Corte, Costura, Dobra e Pacote

document.getElementById("setor").addEventListener("change", async function(){

    const opcaoCorte =
        document.getElementById("opcaoCorte");

    const campoLote =
        document.getElementById("campoLote");

    await fecharCamera();

    if(
        this.value === "Corte" ||
        this.value === "Costura" ||
        this.value === "Dobra" ||
        this.value === "Pacote"
    ){

        opcaoCorte.style.display = "block";

    }else{

        opcaoCorte.style.display = "none";

        campoLote.style.display = "none";

        document.getElementById("tipoCorte").value = "";

        document.getElementById("loteManual").value = "";

    }

    if(
        this.value === "Corte" ||
        this.value === "Costura" ||
        this.value === "Dobra" ||
        this.value === "Pacote"
    ){

        await fecharCamera();

    }

});


document.getElementById("tipoCorte").addEventListener("change", async function(){

    const campoLote =
        document.getElementById("campoLote");

    if(this.value === "producao"){

        await fecharCamera();

        campoLote.style.display = "block";

        document
        .getElementById("loteManual")
        .focus();

    }else if(this.value === "embalagem"){

        campoLote.style.display = "none";

        await fecharCamera();

        await abrirCamera();

    }else{

        campoLote.style.display = "none";

        await fecharCamera();

    }

});


document.getElementById("loteManual").addEventListener("keypress", async function(e){

    if(e.key !== "Enter"){
        return;
    }

    e.preventDefault();

    const lote =
        this.value.trim();

    if(lote === ""){
        return;
    }

    const quantidade =
        prompt(
            "Digite a quantidade produzida:",
            "1"
        );

    if(
        quantidade === null ||
        quantidade.trim() === "" ||
        isNaN(quantidade)
    ){

        document
        .getElementById("resultado")
        .innerHTML =
        "Operação cancelada.";

        return;
    }

    document
    .getElementById("resultado")
    .innerHTML =
    "Enviando lote...";

    const setor =
        document
        .getElementById("setor")
        .value;

    const resposta =
        await fetch(
            URL_API +
            "?setor=" +
            encodeURIComponent(setor) +
            "&tipo=producao" +
            "&lote=" +
            encodeURIComponent(lote) +
            "&quantidade=" +
            encodeURIComponent(quantidade)
        );

    const texto =
        await resposta.text();

    if(texto.startsWith("OK|")){

        const partes =
            texto.split("|");

        const linha =
            partes[1];

        const loteRetorno =
            partes[2];

        document
        .getElementById("resultado")
        .innerHTML =
            "✅ Leitura OK!<br><br>" +
            "📦 Lote: " +
            loteRetorno +
            "<br>" +
            "📍 Linha: C" +
            linha;

        confirmarLeitura();

        this.value = "";

        this.focus();

    }else{

        document
        .getElementById("resultado")
        .innerHTML =
        texto;

    }

});


let html5QrCode = null;

let podeLer = true;

let temporizadorInatividade = null;

let ultimoCodigo = "";

let ultimoHorario = 0;


function confirmarLeitura(){

    try{

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!window.audioContext){

            window.audioContext =
                new AudioContext();

        }

        const ctx =
            window.audioContext;

        if(ctx.state === "suspended"){

            ctx.resume();

        }

        const osc1 =
            ctx.createOscillator();

        const gain1 =
            ctx.createGain();

        osc1.type = "sine";

        osc1.frequency.value = 650;

        gain1.gain.setValueAtTime(
            0.22,
            ctx.currentTime
        );

        gain1.gain.exponentialRampToValueAtTime(
            0.01,
            ctx.currentTime + 0.08
        );

        osc1.connect(gain1);

        gain1.connect(ctx.destination);

        osc1.start();

        osc1.stop(
            ctx.currentTime + 0.08
        );


        const osc2 =
            ctx.createOscillator();

        const gain2 =
            ctx.createGain();

        osc2.type = "sine";

        osc2.frequency.value = 950;

        gain2.gain.setValueAtTime(
            0.25,
            ctx.currentTime + 0.07
        );

        gain2.gain.exponentialRampToValueAtTime(
            0.01,
            ctx.currentTime + 0.18
        );

        osc2.connect(gain2);

        gain2.connect(ctx.destination);

        osc2.start(
            ctx.currentTime + 0.07
        );

        osc2.stop(
            ctx.currentTime + 0.18
        );

    }catch(e){

        console.log(
            "Erro ao emitir bip:",
            e
        );

    }

    if(navigator.vibrate){

        navigator.vibrate(120);

    }

}


function confirmarSucesso(){

    audioSucesso.pause();

    audioSucesso.currentTime = 0;

    audioSucesso
    .play()
    .catch(()=>{});

}


function confirmarErro(){

    audioErro.pause();

    audioErro.currentTime = 0;

    audioErro
    .play()
    .catch(()=>{});

    if(navigator.vibrate){

        navigator.vibrate(
            [150,100,150]
        );

    }

}


function confirmarMeta(){

    audioMeta.pause();

    audioMeta.currentTime = 0;

    audioMeta
    .play()
    .catch(()=>{});

    setTimeout(function(){

        audioMeta.currentTime = 0;

        audioMeta
        .play()
        .catch(()=>{});

    },300);

    setTimeout(function(){

        audioMeta.currentTime = 0;

        audioMeta
        .play()
        .catch(()=>{});

    },600);

    if(navigator.vibrate){

        navigator.vibrate(
            [250,120,250,120,250]
        );

    }

}


function reiniciarTemporizador(){

    clearTimeout(
        temporizadorInatividade
    );

    temporizadorInatividade =
    setTimeout(async function(){

        try{

            if(html5QrCode){

                await html5QrCode.stop();

                html5QrCode = null;

                document
                .getElementById("reader")
                .innerHTML = "";

            }

            document
            .getElementById("resultado")
            .innerHTML =
            "Câmera desligada por inatividade.";

        }catch(e){}

    },60000);

}


async function fecharCamera(){

    if(!html5QrCode){

        return;

    }

    try{

        clearTimeout(
            temporizadorInatividade
        );

        await html5QrCode.stop();

        await html5QrCode.clear();

    }catch(e){

        console.log(e);

    }

    html5QrCode = null;

    document
    .getElementById("reader")
    .innerHTML = "";

}


async function abrirCamera(){

    audioSucesso
    .play()
    .then(() => {

        audioSucesso.pause();

        audioSucesso.currentTime = 0;

    })
    .catch(()=>{});


    audioErro
    .play()
    .then(() => {

        audioErro.pause();

        audioErro.currentTime = 0;

    })
    .catch(()=>{});


    const setor =
        document
        .getElementById("setor")
        .value;


    if(
        setor === "Corte" ||
        setor === "Costura" ||
        setor === "Dobra" ||
        setor === "Pacote"
    ){

        const tipo =
            document
            .getElementById("tipoCorte")
            .value;

        if(tipo === ""){

            alert(
                "Selecione Produção ou Embalagem."
            );

            return;

        }

        if(tipo === "producao"){

            document
            .getElementById("campoLote")
            .style.display = "block";

            document
            .getElementById("reader")
            .innerHTML = "";

            document
            .getElementById("resultado")
            .innerHTML = "";

            document
            .getElementById("loteManual")
            .focus();

            return;

        }

    }


    if(setor == ""){

        alert(
            "Selecione o setor antes de abrir a câmera."
        );

        return;

    }


    if(html5QrCode){

        return;

    }


    html5QrCode =
        new Html5Qrcode("reader");

    iniciarLeitura();

    reiniciarTemporizador();

}


function iniciarLeitura(){

    html5QrCode.start(

        {
            facingMode: "environment"
        },

        {
            fps: 10,
            qrbox: 250
        },

        async function(decodedText){

            const agora =
                Date.now();

            if(
                decodedText === ultimoCodigo &&
                (agora - ultimoHorario) < 2000
            ){

                document
                .getElementById("resultado")
                .innerHTML =
                "⚠ Etiqueta já lida. Aguarde 2 segundos.";

                return;

            }

            if(!podeLer){

                return;

            }

            podeLer = false;

            const setor =
                document
                .getElementById("setor")
                .value;

            if(setor == ""){

                alert(
                    "Selecione o setor."
                );

                podeLer = true;

                return;

            }

            confirmarLeitura();

            reiniciarTemporizador();

            document
            .getElementById("resultado")
            .innerHTML =
            "Enviando...";

            try{

                let urlLeitura =
                    URL_API +
                    "?codigo=" +
                    encodeURIComponent(decodedText) +
                    "&setor=" +
                    encodeURIComponent(setor);


                if(setor === "Pacote"){

                    const tipo =
                        document
                        .getElementById("tipoCorte")
                        .value;

                    urlLeitura +=
                        "&tipo=" +
                        encodeURIComponent(tipo);

                }


                const resposta =
                    await fetch(urlLeitura);

                const texto =
                    await resposta.text();


                if(texto.startsWith("OK|")){

                    const partes =
                        texto.split("|");

                    const linha =
                        partes[1];

                    const lote =
                        partes[2];


                    if(
                        partes.length >= 4 &&
                        partes[3] === "META"
                    ){

                        document
                        .getElementById("resultado")
                        .innerHTML =

                            "🎉 <b>LOTE FINALIZADO!</b><br><br>" +

                            "✅ Meta de caixas atingida.<br><br>" +

                            "📦 Lote: " +
                            lote +
                            "<br>" +

                            "📍 Linha: C" +
                            linha;

                        confirmarMeta();

                    }else{

                        document
                        .getElementById("resultado")
                        .innerHTML =

                            "✅ Leitura OK!<br><br>" +

                            "📦 Lote: " +
                            lote +
                            "<br>" +

                            "📍 Linha: C" +
                            linha;

                        confirmarSucesso();

                    }


                    ultimoCodigo =
                        decodedText;

                    ultimoHorario =
                        agora;


                }else{

                    document
                    .getElementById("resultado")
                    .innerHTML =
                    texto;

                    confirmarErro();

                }


                await html5QrCode.stop();

                podeLer = true;


                setTimeout(function(){

                    iniciarLeitura();

                    reiniciarTemporizador();

                },2000);


            }catch(e){

                document
                .getElementById("resultado")
                .innerHTML =
                "ERRO: " + e;

                confirmarErro();


                try{

                    await html5QrCode.stop();

                }catch(err){}


                podeLer = true;


                setTimeout(function(){

                    iniciarLeitura();

                    reiniciarTemporizador();

                },2000);

            }

        }

    );

}

</script>

</body>

</html>
