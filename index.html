<script>

const URL_API = "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

let html5QrCode = null;
let ultimoQr = "";

function confirmarLeitura(){

    // Bip
    const audio = new Audio(
        "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
    );

    audio.play().catch(()=>{});

    // Vibração
    if(navigator.vibrate){
        navigator.vibrate(200);
    }

}

function abrirCamera(){

    if(html5QrCode){
        return;
    }

    html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(

        { facingMode: "environment" },

        {
            fps:10,
            qrbox:250
        },

        // QR encontrado
        async function(decodedText){

            // Se ainda é o mesmo QR, ignora
            if(decodedText === ultimoQr){
                return;
            }

            ultimoQr = decodedText;

            document.getElementById("resultado").innerHTML =
            "Enviando...";

            try{

                const resposta = await fetch(
                    URL_API +
                    "?codigo=" +
                    encodeURIComponent(decodedText)
                );

                const texto = await resposta.text();

                document.getElementById("resultado").innerHTML =
                texto;

                if(texto.startsWith("OK")){
                    confirmarLeitura();
                }

            }catch(e){

                document.getElementById("resultado").innerHTML =
                "ERRO: " + e;

            }

        },

        // Nenhum QR encontrado
        function(){

            // Quando o QR desaparecer,
            // libera uma nova leitura
            ultimoQr = "";

        }

    );

}

</script>
