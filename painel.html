<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PACOTE • Painel de Produção</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #07111f 0%,
          #0b1c31 50%,
          #102944 100%
        );

      color: #ffffff;

      min-height: 100vh;

      overflow-x: hidden;
    }


    /* =========================================================
       CONTAINER PRINCIPAL
       ========================================================= */

    .painel {
      width: 100%;
      min-height: 100vh;

      padding:
        22px
        24px
        80px
        24px;
    }


    /* =========================================================
       CABEÇALHO
       ========================================================= */

    .cabecalho {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 22px;
    }


    .titulo-area {
      display: flex;

      flex-direction: column;

      gap: 5px;
    }


    .titulo {

      font-size: 30px;

      font-weight: 800;

      letter-spacing: 1px;

      color: #ffffff;
    }


    .subtitulo {

      font-size: 14px;

      color: #9fb2c9;

      font-weight: 500;
    }


    .data-area {

      text-align: right;

      display: flex;

      flex-direction: column;

      gap: 4px;
    }


    .data-label {

      font-size: 11px;

      color: #7890aa;

      text-transform: uppercase;

      letter-spacing: 1px;
    }


    .data-valor {

      font-size: 20px;

      font-weight: 700;

      color: #ffffff;
    }


    /* =========================================================
       RESUMO
       ========================================================= */

    .resumo {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 14px;

      margin-bottom: 22px;
    }


    .resumo-card {

      position: relative;

      background:
        rgba(18, 39, 64, 0.92);

      border:
        1px solid
        rgba(110, 151, 195, 0.18);

      border-radius: 14px;

      padding: 18px 20px;

      min-height: 108px;

      overflow: hidden;

      box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.18);
    }


    .resumo-card::after {

      content: "";

      position: absolute;

      right: -25px;

      bottom: -35px;

      width: 90px;

      height: 90px;

      border-radius: 50%;

      background:
        rgba(60, 145, 220, 0.07);
    }


    .resumo-label {

      color: #8fa6be;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 0.8px;

      margin-bottom: 8px;
    }


    .resumo-valor {

      color: #ffffff;

      font-size: 30px;

      font-weight: 800;

      line-height: 1;
    }


    .resumo-percentual {

      color: #63d391;

      font-size: 30px;

      font-weight: 800;

      line-height: 1;
    }


    /* =========================================================
       ÁREA DOS ITENS
       ========================================================= */

    .itens {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }


    /* =========================================================
       CARD DE PRODUÇÃO
       ========================================================= */

    .card-item {

      position: relative;

      background:
        rgba(13, 31, 52, 0.96);

      border:
        1px solid
        rgba(101, 140, 180, 0.20);

      border-radius: 16px;

      padding: 18px;

      min-height: 210px;

      box-shadow:
        0 12px 28px
        rgba(0, 0, 0, 0.20);

      overflow: hidden;
    }


    .card-item:hover {

      border-color:
        rgba(101, 170, 225, 0.35);
    }


    .card-topo {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 14px;
    }


    .numero-item {

      display: flex;

      align-items: center;

      justify-content: center;

      width: 42px;

      height: 42px;

      border-radius: 10px;

      background:
        #173655;

      color: #ffffff;

      font-size: 17px;

      font-weight: 800;

      flex-shrink: 0;
    }


    .informacoes {

      flex: 1;

      min-width: 0;
    }


    .produto {

      color: #ffffff;

      font-size: 17px;

      font-weight: 800;

      line-height: 1.25;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      margin-bottom: 5px;
    }


    .lote {

      color: #8098b2;

      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      border-radius: 30px;

      padding: 6px 10px;

      font-size: 10px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 0.5px;

      white-space: nowrap;
    }


    .status::before {

      content: "";

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: currentColor;
    }


    .status-ok {

      color: #63d391;

      background:
        rgba(72, 202, 128, 0.10);
    }


    .status-andamento {

      color: #55b7ff;

      background:
        rgba(55, 166, 255, 0.10);
    }


    .status-pendente {

      color: #ffbd61;

      background:
        rgba(255, 189, 97, 0.10);
    }


    .status-finalizado {

      color: #9ee7ba;

      background:
        rgba(94, 211, 139, 0.12);
    }


    /* =========================================================
       CORPO DO CARD
       ========================================================= */

    .card-corpo {

      display: flex;

      align-items: center;

      gap: 22px;
    }


    .progresso-circulo {

      width: 105px;

      height: 105px;

      flex-shrink: 0;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      background:
        conic-gradient(
          #42b6ff 0deg,
          #42b6ff var(--progresso-graus, 0deg),
          #203b58 var(--progresso-graus, 0deg),
          #203b58 360deg
        );
    }


    .progresso-circulo::before {

      content: "";

      position: absolute;

      inset: 8px;

      border-radius: 50%;

      background:
        #0d1f34;
    }


    .progresso-centro {

      position: relative;

      z-index: 1;

      text-align: center;
    }


    .progresso-numero {

      font-size: 22px;

      font-weight: 800;

      color: #ffffff;

      line-height: 1;
    }


    .progresso-texto {

      margin-top: 4px;

      font-size: 9px;

      color: #8198b1;

      text-transform: uppercase;
    }


    .numeros {

      flex: 1;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 10px;
    }


    .numero-bloco {

      min-width: 0;
    }


    .numero-label {

      font-size: 10px;

      color: #728aa4;

      text-transform: uppercase;

      letter-spacing: 0.4px;

      margin-bottom: 5px;
    }


    .numero-valor {

      font-size: 22px;

      font-weight: 800;

      color: #ffffff;
    }


    .numero-valor.pendente {

      color: #ffbd61;
    }


    /* =========================================================
       BARRA DE PROGRESSO
       ========================================================= */

    .barra-area {

      margin-top: 18px;
    }


    .barra-topo {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 7px;
    }


    .barra-label {

      font-size: 10px;

      color: #728aa4;

      text-transform: uppercase;
    }


    .barra-percentual {

      font-size: 11px;

      color: #9db2c8;

      font-weight: 700;
    }


    .barra {

      width: 100%;

      height: 7px;

      border-radius: 20px;

      background:
        #1b334e;

      overflow: hidden;
    }


    .barra-preenchida {

      height: 100%;

      width: 0%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #2f9eea,
          #63d391
        );

      transition:
        width 0.5s ease;
    }


    /* =========================================================
       RODAPÉ
       ========================================================= */

    .rodape {

      position: fixed;

      left: 0;

      right: 0;

      bottom: 0;

      height: 42px;

      padding:
        0 22px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      background:
        rgba(5, 16, 29, 0.96);

      border-top:
        1px solid
        rgba(107, 145, 181, 0.14);

      z-index: 20;
    }


    .api-status {

      display: flex;

      align-items: center;

      gap: 8px;

      color: #8fa6be;

      font-size: 11px;
    }


    .api-status-ponto {

      width: 8px;

      height: 8px;

      border-radius: 50%;

      background: #8998a8;

      box-shadow:
        0 0 8px
        rgba(137, 152, 168, 0.35);
    }


    .api-status.ok
    .api-status-ponto {

      background: #54d786;

      box-shadow:
        0 0 9px
        rgba(84, 215, 134, 0.65);
    }


    .api-status.carregando
    .api-status-ponto {

      background: #55b7ff;

      box-shadow:
        0 0 9px
        rgba(85, 183, 255, 0.60);
    }


    .ultima-atualizacao {

      color: #71879e;

      font-size: 10px;

      text-align: right;
    }


    /* =========================================================
       OVERLAY DE ERRO
       ========================================================= */

    #erroOverlay {

      position: fixed;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      background:
        rgba(3, 11, 20, 0.88);

      backdrop-filter:
        blur(5px);

      z-index: 100;
    }


    #erroOverlay.visivel {

      display: flex;
    }


    .erro-caixa {

      width: min(
        480px,
        calc(100% - 40px)
      );

      padding: 30px;

      text-align: center;

      border-radius: 18px;

      background:
        #10253c;

      border:
        1px solid
        rgba(255, 100, 100, 0.25);

      box-shadow:
        0 25px 60px
        rgba(0, 0, 0, 0.40);
    }


    .erro-icone {

      width: 54px;

      height: 54px;

      margin:
        0 auto
        16px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        rgba(255, 85, 85, 0.12);

      color: #ff7373;

      font-size: 27px;

      font-weight: 800;
    }


    .erro-titulo {

      color: #ffffff;

      font-size: 20px;

      font-weight: 800;

      margin-bottom: 9px;
    }


    .erro-mensagem {

      color: #9aafc4;

      font-size: 13px;

      line-height: 1.5;
    }


    /* =========================================================
       RESPONSIVO
       ========================================================= */

    @media (max-width: 900px) {

      .resumo {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .itens {

        grid-template-columns:
          1fr;
      }

    }


    @media (max-width: 600px) {

      .painel {

        padding:
          16px
          14px
          70px
          14px;
      }


      .cabecalho {

        align-items: flex-start;
      }


      .titulo {

        font-size: 24px;
      }


      .data-valor {

        font-size: 15px;
      }


      .resumo {

        gap: 9px;
      }


      .resumo-card {

        padding: 14px;

        min-height: 92px;
      }


      .resumo-valor,
      .resumo-percentual {

        font-size: 24px;
      }


      .card-item {

        padding: 14px;
      }


      .card-corpo {

        gap: 14px;
      }


      .progresso-circulo {

        width: 88px;

        height: 88px;
      }


      .progresso-circulo::before {

        inset: 7px;
      }


      .progresso-numero {

        font-size: 18px;
      }


      .numeros {

        gap: 7px;
      }


      .numero-valor {

        font-size: 18px;
      }


      .rodape {

        padding:
          0 12px;
      }

    }


    @media (max-width: 420px) {

      .cabecalho {

        flex-direction: column;
      }


      .data-area {

        text-align: left;
      }


      .resumo {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }


      .card-topo {

        flex-wrap: wrap;
      }


      .card-corpo {

        align-items: flex-start;
      }


      .progresso-circulo {

        width: 78px;

        height: 78px;
      }


      .numeros {

        grid-template-columns:
          1fr;
      }


      .numero-bloco {

        display: flex;

        align-items: center;

        justify-content: space-between;

        border-bottom:
          1px solid
          rgba(112, 145, 176, 0.10);

        padding-bottom: 5px;
      }


      .numero-label {

        margin-bottom: 0;
      }

    }

  </style>

</head>


<body>

  <main class="painel">


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="cabecalho">

      <div class="titulo-area">

        <div class="titulo">
          PACOTE
        </div>

        <div class="subtitulo">
          Painel de Produção
        </div>

      </div>


      <div class="data-area">

        <div class="data-label">
          Data da produção
        </div>

        <div
          class="data-valor"
          id="dataPainel"
        >
          --
        </div>

      </div>

    </header>


    <!-- =====================================================
         RESUMO
         ===================================================== -->

    <section class="resumo">


      <div class="resumo-card">

        <div class="resumo-label">
          Meta total
        </div>

        <div
          class="resumo-valor"
          id="metaTotal"
        >
          0
        </div>

      </div>


      <div class="resumo-card">

        <div class="resumo-label">
          Produzido
        </div>

        <div
          class="resumo-valor"
          id="produzidoTotal"
        >
          0
        </div>

      </div>


      <div class="resumo-card">

        <div class="resumo-label">
          Pendente
        </div>

        <div
          class="resumo-valor"
          id="pendenteTotal"
        >
          0
        </div>

      </div>


      <div class="resumo-card">

        <div class="resumo-label">
          Progresso geral
        </div>

        <div
          class="resumo-percentual"
          id="progressoGeral"
        >
          0%
        </div>

      </div>


    </section>


    <!-- =====================================================
         ITENS
         ===================================================== -->

    <section
      class="itens"
      id="listaItens"
    >

      <!-- Os 10 cards são criados pelo JavaScript -->

    </section>


  </main>


  <!-- =======================================================
       RODAPÉ
       ======================================================= -->

  <footer class="rodape">

    <div
      class="api-status"
      id="apiStatus"
    >

      <span
        class="api-status-ponto"
      ></span>

      <span id="apiStatusTexto">
        Aguardando conexão...
      </span>

    </div>


    <div
      class="ultima-atualizacao"
      id="ultimaAtualizacao"
    >
      Atualizado: --
    </div>

  </footer>


  <!-- =======================================================
       OVERLAY DE ERRO
       ======================================================= -->

  <div
    id="erroOverlay"
  >

    <div class="erro-caixa">

      <div class="erro-icone">
        !
      </div>

      <div class="erro-titulo">
        Não foi possível carregar o painel
      </div>

      <div
        class="erro-mensagem"
        id="erroMensagem"
      >
        Não foi possível atualizar os dados.
        O painel tentará novamente automaticamente.
      </div>

    </div>

  </div>


  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script>


    /* =======================================================
       CONFIGURAÇÃO
       ======================================================= */

    const URL_API =
      "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";


    const SETOR =
      "PACOTE";


    const INTERVALO_MS =
      15000;


    /* =======================================================
       ELEMENTOS DA TELA
       ======================================================= */

    const elementos = {

      data:
        document.getElementById(
          "dataPainel"
        ),

      metaTotal:
        document.getElementById(
          "metaTotal"
        ),

      produzidoTotal:
        document.getElementById(
          "produzidoTotal"
        ),

      pendenteTotal:
        document.getElementById(
          "pendenteTotal"
        ),

      progressoGeral:
        document.getElementById(
          "progressoGeral"
        ),

      listaItens:
        document.getElementById(
          "listaItens"
        ),

      apiStatus:
        document.getElementById(
          "apiStatus"
        ),

      apiStatusTexto:
        document.getElementById(
          "apiStatusTexto"
        ),

      ultimaAtualizacao:
        document.getElementById(
          "ultimaAtualizacao"
        ),

      erroOverlay:
        document.getElementById(
          "erroOverlay"
        ),

      erroMensagem:
        document.getElementById(
          "erroMensagem"
        )

    };


    /* =======================================================
       CONTROLE DE CARREGAMENTO
       ======================================================= */

    let carregamentoEmAndamento =
      false;


    /* =======================================================
       FORMATAÇÃO DE NÚMEROS
       ======================================================= */

    function formatarNumero(valor) {

      const numero =
        Number(valor) || 0;

      return numero.toLocaleString(
        "pt-BR"
      );

    }


    function formatarPercentual(valor) {

      const numero =
        Number(valor) || 0;

      return (
        Math.round(numero * 10) / 10
      ).toLocaleString(
        "pt-BR"
      ) + "%";

    }


    function limitarPercentual(valor) {

      const numero =
        Number(valor) || 0;

      return Math.max(
        0,
        Math.min(
          100,
          numero
        )
      );

    }


    /* =======================================================
       SEGURANÇA HTML
       ======================================================= */

    function escaparHTML(valor) {

      return String(
        valor ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =======================================================
       DETERMINA STATUS
       ======================================================= */

    function determinarStatus(
      produzido,
      meta,
      percentual
    ) {

      const prod =
        Number(produzido) || 0;

      const alvo =
        Number(meta) || 0;

      const progresso =
        Number(percentual) || 0;


      if (
        alvo > 0 &&
        prod >= alvo
      ) {

        return {
          classe: "status-finalizado",
          texto: "Finalizado"
        };

      }


      if (
        progresso > 0
      ) {

        return {
          classe: "status-andamento",
          texto: "Em andamento"
        };

      }


      return {
        classe: "status-pendente",
        texto: "Pendente"
      };

    }


    /* =======================================================
       CRIA CARD
       ======================================================= */

    function criarCard(
      item,
      indice
    ) {

      const numero =
        item.numero ??
        item.id ??
        (indice + 1);


      const produto =
        item.produto ||
        "--";


      const lote =
        item.lote ||
        "--";


      const meta =
        Number(item.meta) || 0;


      const produzido =
        Number(item.produzido) || 0;


      const pendente =
        Number(item.pendente) ||
        Math.max(
          meta - produzido,
          0
        );


      let percentual =
        Number(item.progresso);


      if (
        !Number.isFinite(percentual)
      ) {

        percentual =
          meta > 0
            ? (
                produzido /
                meta
              ) * 100
            : 0;

      }


      percentual =
        limitarPercentual(
          percentual
        );


      const status =
        determinarStatus(
          produzido,
          meta,
          percentual
        );


      const graus =
        (
          percentual /
          100
        ) * 360;


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card-item";


      card.innerHTML = `

        <div class="card-topo">

          <div
            class="numero-item"
          >
            ${escaparHTML(numero)}
          </div>


          <div class="informacoes">

            <div
              class="produto"
              title="${escaparHTML(produto)}"
            >
              ${escaparHTML(produto)}
            </div>

            <div
              class="lote"
              title="${escaparHTML(lote)}"
            >
              Lote: ${escaparHTML(lote)}
            </div>

          </div>


          <div
            class="status ${status.classe}"
          >
            ${status.texto}
          </div>

        </div>


        <div class="card-corpo">


          <div
            class="progresso-circulo"
            style="--progresso-graus: ${graus}deg;"
          >

            <div
              class="progresso-centro"
            >

              <div
                class="progresso-numero"
              >
                ${Math.round(percentual)}%
              </div>

              <div
                class="progresso-texto"
              >
                progresso
              </div>

            </div>

          </div>


          <div class="numeros">


            <div class="numero-bloco">

              <div
                class="numero-label"
              >
                Produzido
              </div>

              <div
                class="numero-valor"
              >
                ${formatarNumero(produzido)}
              </div>

            </div>


            <div class="numero-bloco">

              <div
                class="numero-label"
              >
                Meta
              </div>

              <div
                class="numero-valor"
              >
                ${formatarNumero(meta)}
              </div>

            </div>


            <div class="numero-bloco">

              <div
                class="numero-label"
              >
                Pendente
              </div>

              <div
                class="numero-valor pendente"
              >
                ${formatarNumero(pendente)}
              </div>

            </div>


          </div>


        </div>


        <div class="barra-area">

          <div class="barra-topo">

            <span
              class="barra-label"
            >
              Progresso
            </span>

            <span
              class="barra-percentual"
            >
              ${formatarPercentual(percentual)}
            </span>

          </div>


          <div class="barra">

            <div
              class="barra-preenchida"
              style="width: ${percentual}%"
            ></div>

          </div>

        </div>

      `;


      return card;

    }


    /* =======================================================
       NORMALIZA ITENS
       ======================================================= */

    function normalizarItens(
      itens
    ) {

      if (
        !Array.isArray(itens)
      ) {

        return [];

      }


      return itens.map(
        function(item, indice) {

          return {

            numero:
              item.numero ??
              item.id ??
              item.item ??
              (indice + 1),

            produto:
              item.produto ??
              item.nome ??
              "",

            lote:
              item.lote ??
              "",

            meta:
              Number(
                item.meta ??
                0
              ),

            produzido:
              Number(
                item.produzido ??
                item.producao ??
                0
              ),

            pendente:
              Number(
                item.pendente ??
                0
              ),

            progresso:
              Number(
                item.progresso ??
                item.percentual ??
                0
              )

          };

        }
      );

    }


    /* =======================================================
       RENDERIZA ITENS
       ======================================================= */

    function renderizarItens(
      itens
    ) {

      elementos.listaItens.innerHTML =
        "";


      const quantidade =
        Math.max(
          itens.length,
          10
        );


      for (
        let i = 0;
        i < quantidade;
        i++
      ) {

        const item =
          itens[i] || {

            numero:
              i + 1,

            produto:
              "--",

            lote:
              "--",

            meta:
              0,

            produzido:
              0,

            pendente:
              0,

            progresso:
              0

          };


        elementos.listaItens.appendChild(
          criarCard(
            item,
            i
          )
        );

      }

    }


    /* =======================================================
       RENDERIZA RESUMO
       ======================================================= */

    function renderizarResumo(
      resumo,
      itens
    ) {

      resumo =
        resumo || {};


      let metaTotal =
        Number(
          resumo.metaTotal
        );


      let produzidoTotal =
        Number(
          resumo.produzidoTotal
        );


      let pendenteTotal =
        Number(
          resumo.pendenteTotal
        );


      let progressoGeral =
        Number(
          resumo.progressoGeral
        );


      if (
        !Number.isFinite(metaTotal)
      ) {

        metaTotal =
          itens.reduce(
            function(total, item) {

              return (
                total +
                (
                  Number(item.meta) ||
                  0
                )
              );

            },
            0
          );

      }


      if (
        !Number.isFinite(produzidoTotal)
      ) {

        produzidoTotal =
          itens.reduce(
            function(total, item) {

              return (
                total +
                (
                  Number(item.produzido) ||
                  0
                )
              );

            },
            0
          );

      }


      if (
        !Number.isFinite(pendenteTotal)
      ) {

        pendenteTotal =
          Math.max(
            metaTotal -
            produzidoTotal,
            0
          );

      }


      if (
        !Number.isFinite(progressoGeral)
      ) {

        progressoGeral =
          metaTotal > 0
            ? (
                produzidoTotal /
                metaTotal
              ) * 100
            : 0;

      }


      progressoGeral =
        limitarPercentual(
          progressoGeral
        );


      elementos.metaTotal.textContent =
        formatarNumero(
          metaTotal
        );


      elementos.produzidoTotal.textContent =
        formatarNumero(
          produzidoTotal
        );


      elementos.pendenteTotal.textContent =
        formatarNumero(
          pendenteTotal
        );


      elementos.progressoGeral.textContent =
        formatarPercentual(
          progressoGeral
        );

    }


    /* =======================================================
       STATUS DA API
       ======================================================= */

    function definirStatus(
      classe,
      texto
    ) {

      elementos.apiStatus.className =
        "api-status " +
        classe;


      elementos.apiStatusTexto.textContent =
        texto;

    }


    /* =======================================================
       ERRO
       ======================================================= */

    function mostrarErro(
      mensagem
    ) {

      elementos.erroMensagem.textContent =
        mensagem;


      elementos.erroOverlay.classList.add(
        "visivel"
      );

    }


    function esconderErro() {

      elementos.erroOverlay.classList.remove(
        "visivel"
      );

    }


    /* =======================================================
       CARREGAMENTO JSONP
       ======================================================= */

    function carregarDadosReais() {

      /*
       * Evita duas consultas simultâneas.
       */

      if (
        carregamentoEmAndamento
      ) {

        return;

      }


      carregamentoEmAndamento =
        true;


      definirStatus(
        "carregando",
        "Atualizando dados..."
      );


      /*
       * Nome exclusivo da função de callback.
       */

      const callback =
        "receberDadosPainel_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);


      /*
       * Cria o elemento <script>.
       *
       * O JSONP utiliza uma requisição
       * de script em vez de fetch().
       */

      const script =
        document.createElement(
          "script"
        );


      let finalizado =
        false;


      /*
       * Timeout de segurança.
       */

      const timeoutId =
        setTimeout(
          function() {

            finalizarErro(
              "O servidor demorou para responder. " +
              "Tentando novamente automaticamente."
            );

          },
          10000
        );


      /*
       * Limpeza da chamada.
       */

      function limpar() {

        clearTimeout(
          timeoutId
        );


        delete window[
          callback
        ];


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        carregamentoEmAndamento =
          false;

      }


      /*
       * Tratamento de erro.

       */

      function finalizarErro(
        mensagem
      ) {

        if (
          finalizado
        ) {

          return;

        }


        finalizado =
          true;


        console.error(
          mensagem
        );


        definirStatus(
          "",
          "Erro de conexão • tentando novamente"
        );


        mostrarErro(
          mensagem
        );


        setTimeout(
          esconderErro,
          3000
        );


        limpar();

      }


      /*
       * CALLBACK JSONP.
       */

      window[callback] =
        function(resultado) {


          if (
            finalizado
          ) {

            return;

          }


          finalizado =
            true;


          try {


            /*
             * Verifica se o Apps Script
             * respondeu corretamente.
             */

            if (
              !resultado ||
              resultado.sucesso !== true
            ) {

              throw new Error(
                resultado &&
                resultado.erro
                  ? resultado.erro
                  : "Resposta inválida da API"
              );

            }


            /*
             * Normaliza os itens recebidos.
             */

            const itens =
              normalizarItens(
                resultado.itens
              );


            /*
             * Atualiza os cards.
             */

            renderizarItens(
              itens
            );


            /*
             * Atualiza o resumo.
             */

            renderizarResumo(
              resultado.resumo,
              itens
            );


            /*
             * Atualiza a data.
             */

            elementos.data.textContent =
              resultado.data ||
              "--";


            /*
             * Atualiza o horário.
             */

            elementos.ultimaAtualizacao.textContent =
              resultado.atualizacao
                ? "Atualizado: " +
                  resultado.atualizacao
                : "Atualizado agora";


            /*
             * Conexão funcionando.
             */

            definirStatus(
              "ok",
              "Conectado • dados atualizados"
            );


            /*
             * Esconde eventual erro
             * anterior.
             */

            esconderErro();


          } catch (
            erro
          ) {


            console.error(
              "Erro nos dados do painel:",
              erro
            );


            definirStatus(
              "",
              "Erro de conexão • tentando novamente"
            );


            mostrarErro(
              "Não foi possível atualizar os dados. " +
              "O painel tentará novamente automaticamente."
            );


            setTimeout(
              esconderErro,
              3000
            );


          } finally {


            limpar();

          }

        };


      /*
       * Erro de carregamento do script.
       */

      script.onerror =
        function() {

          finalizarErro(
            "Não foi possível conectar ao servidor. " +
            "Tentando novamente automaticamente."
          );

        };


      /*
       * Monta a URL do Apps Script.
       */

      const separador =
        URL_API.indexOf("?") >= 0
          ? "&"
          : "?";


      const url =
        URL_API +
        separador +
        "painel=PACOTE" +
        "&callback=" +
        encodeURIComponent(
          callback
        ) +
        "&_=" +
        Date.now();


      /*
       * Define o endereço do script.
       */

      script.src =
        url;


      /*
       * Inicia a requisição JSONP.
       */

      document.head.appendChild(
        script
      );

    }


    /* =======================================================
       INICIALIZAÇÃO
       ======================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {


        /*
         * Primeira atualização imediatamente.
         */

        carregarDadosReais();


        /*
         * Atualização automática
         * a cada 15 segundos.
         */

        setInterval(
          carregarDadosReais,
          INTERVALO_MS
        );

      }
    );


  </script>
