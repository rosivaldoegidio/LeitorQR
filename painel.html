<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Painel de Produção</title>

<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f1f3f6;

    color:#20252b;

    overflow:hidden;
}


/* =========================================================
   PAINEL PRINCIPAL
========================================================= */

.painel{

    width:100vw;
    height:100vh;

    padding:14px 18px;

    display:flex;
    flex-direction:column;

    gap:12px;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.cabecalho{

    width:100%;

    background:white;

    border-radius:12px;

    padding:12px 18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);

    min-height:72px;
}

.titulo-area{

    display:flex;
    flex-direction:column;

    gap:3px;
}

.titulo{

    font-size:28px;

    font-weight:800;

    letter-spacing:.5px;
}

.subtitulo{

    font-size:14px;

    color:#6c737c;
}

.info-data{

    text-align:right;
}

.data{

    font-size:19px;

    font-weight:700;
}

.hora{

    font-size:14px;

    color:#6c737c;

    margin-top:3px;
}


/* =========================================================
   BARRA DE SETORES
========================================================= */

.setores{

    display:flex;

    gap:8px;

    width:100%;

    overflow:hidden;
}

.setor{

    flex:1;

    border:0;

    border-radius:8px;

    padding:9px 12px;

    background:#dfe3e8;

    color:#4b535c;

    font-weight:700;

    font-size:13px;

    cursor:pointer;

    white-space:nowrap;
}

.setor.ativo{

    background:#20252b;

    color:white;
}


/* =========================================================
   RESUMO
========================================================= */

.resumo{

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr 1fr;

    gap:10px;
}

.resumo-box{

    background:white;

    border-radius:10px;

    padding:10px 14px;

    box-shadow:
        0 2px 7px rgba(0,0,0,.06);

    min-height:58px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.resumo-label{

    font-size:11px;

    color:#7a8189;

    text-transform:uppercase;

    letter-spacing:.5px;
}

.resumo-valor{

    font-size:23px;

    font-weight:800;

    margin-top:2px;
}


/* =========================================================
   GRADE DOS ITENS
========================================================= */

.itens{

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
        repeat(5, minmax(0,1fr));

    grid-template-rows:
        repeat(2, minmax(0,1fr));

    gap:12px;
}


/* =========================================================
   CARTÃO DO ITEM
========================================================= */

.card{

    background:white;

    border-radius:14px;

    padding:12px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.08);

    min-width:0;

    min-height:0;

    display:flex;

    flex-direction:column;

    overflow:hidden;
}


/* =========================================================
   CABEÇALHO DO CARD
========================================================= */

.card-topo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    min-height:28px;
}

.item-numero{

    font-size:15px;

    font-weight:800;
}

.status-pequeno{

    font-size:10px;

    font-weight:800;

    padding:4px 7px;

    border-radius:20px;

    background:#eef0f2;

    color:#666;
}


/* =========================================================
   PRODUTO
========================================================= */

.produto{

    margin-top:5px;

    font-size:14px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.lote{

    margin-top:2px;

    font-size:11px;

    color:#737a82;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =========================================================
   ÁREA DO CÍRCULO
========================================================= */

.grafico{

    flex:1;

    min-height:0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:5px 0;
}


/* =========================================================
   CÍRCULO DE PROGRESSO
========================================================= */

.circular{

    position:relative;

    width:min(18vh, 145px);

    height:min(18vh, 145px);

    min-width:105px;

    min-height:105px;

    max-width:145px;

    max-height:145px;
}

.circular svg{

    width:100%;

    height:100%;

    transform:rotate(-90deg);
}

.circular circle{

    fill:none;

    stroke-width:10;
}

.trilha{

    stroke:#e7e9ec;
}

.progresso{

    stroke-linecap:round;

    transition:
        stroke-dashoffset .8s ease;
}


/* =========================================================
   TEXTO NO CENTRO DO CÍRCULO
========================================================= */

.circular-centro{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.percentual{

    font-size:28px;

    font-weight:900;

    line-height:1;
}

.quantidade{

    margin-top:6px;

    font-size:12px;

    font-weight:700;

    color:#5e666e;
}

.meta{

    margin-top:2px;

    font-size:10px;

    color:#8a9097;
}


/* =========================================================
   RODAPÉ DO CARD
========================================================= */

.card-bottom{

    text-align:center;

    min-height:35px;
}

.situacao{

    font-size:12px;

    font-weight:800;
}

.pendente{

    margin-top:3px;

    font-size:10px;

    color:#747b83;
}


/* =========================================================
   CORES DOS STATUS
========================================================= */

.status-baixo{

    color:#c62828;
}

.status-atencao{

    color:#c17b00;
}

.status-andamento{

    color:#2767b1;
}

.status-meta{

    color:#218739;
}

.status-sem-meta{

    color:#777;
}


/* =========================================================
   CORES DA BORDA
========================================================= */

.cor-baixo{

    stroke:#d64545;
}

.cor-atencao{

    stroke:#e1a62b;
}

.cor-andamento{

    stroke:#3b82c4;
}

.cor-meta{

    stroke:#32a852;
}

.cor-sem-meta{

    stroke:#aeb4ba;
}


/* =========================================================
   RODAPÉ DO PAINEL
========================================================= */

.rodape{

    height:20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:10px;

    color:#8a9097;
}


/* =========================================================
   TELAS MENORES
========================================================= */

@media(max-width:1100px){

    body{
        overflow:auto;
    }

    .painel{
        height:auto;
        min-height:100vh;
    }

    .itens{

        grid-template-columns:
            repeat(3, minmax(0,1fr));

        grid-template-rows:none;

        flex:none;
    }

    .card{
        min-height:300px;
    }
}


@media(max-width:700px){

    .painel{
        padding:10px;
    }

    .cabecalho{
        padding:10px 12px;
    }

    .titulo{
        font-size:20px;
    }

    .subtitulo{
        font-size:11px;
    }

    .data{
        font-size:14px;
    }

    .resumo{

        grid-template-columns:
            1fr 1fr;
    }

    .itens{

        grid-template-columns:
            1fr 1fr;
    }

    .card{
        min-height:280px;
    }
}


@media(max-width:450px){

    .cabecalho{
        min-height:65px;
    }

    .info-data{
        display:none;
    }

    .setor{
        font-size:11px;
        padding:8px 6px;
    }

    .itens{
        grid-template-columns:1fr;
    }

    .card{
        min-height:280px;
    }
}

</style>

</head>


<body>


<div class="painel">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="cabecalho">

        <div class="titulo-area">

            <div class="titulo">
                PAINEL DE PRODUÇÃO
            </div>

            <div class="subtitulo">
                Acompanhamento da produção diária
            </div>

        </div>


        <div class="info-data">

            <div
                class="data"
                id="dataAtual">
            </div>

            <div
                class="hora"
                id="horaAtual">
            </div>

        </div>

    </header>



    <!-- =====================================================
         SETORES
    ====================================================== -->

    <div class="setores">

        <button class="setor ativo">
            PACOTE
        </button>

        <button class="setor">
            PRODUÇÃO
        </button>

        <button class="setor">
            EXPEDIÇÃO
        </button>

        <button class="setor">
            ESTOQUE
        </button>

    </div>



    <!-- =====================================================
         RESUMO
    ====================================================== -->

    <div class="resumo">

        <div class="resumo-box">

            <div class="resumo-label">
                Meta total
            </div>

            <div
                class="resumo-valor"
                id="metaTotal">
                1.000
            </div>

        </div>


        <div class="resumo-box">

            <div class="resumo-label">
                Produzido
            </div>

            <div
                class="resumo-valor"
                id="produzidoTotal">
                580
            </div>

        </div>


        <div class="resumo-box">

            <div class="resumo-label">
                Pendentes
            </div>

            <div
                class="resumo-valor"
                id="pendentesTotal">
                420
            </div>

        </div>


        <div class="resumo-box">

            <div class="resumo-label">
                Progresso geral
            </div>

            <div
                class="resumo-valor"
                id="progressoTotal">
                58%
            </div>

        </div>

    </div>



    <!-- =====================================================
         ITENS
    ====================================================== -->

    <main
        class="itens"
        id="listaItens">
    </main>



    <!-- =====================================================
         RODAPÉ
    ====================================================== -->

    <footer class="rodape">

        <span>
            Painel de Produção
        </span>

        <span>
            Atualização automática
        </span>

    </footer>


</div>



<script>

/* =========================================================
   DADOS DOS ITENS

   POR ENQUANTO ESTÃO COMO TESTE VISUAL.

   Depois vamos ligar esta parte diretamente à sua planilha.
========================================================= */

const dados = [

    {
        item:1,
        produto:"Produto 01",
        lote:"Lote 001",
        produzido:150,
        meta:310
    },

    {
        item:2,
        produto:"Produto 02",
        lote:"Lote 002",
        produzido:220,
        meta:300
    },

    {
        item:3,
        produto:"Produto 03",
        lote:"Lote 003",
        produzido:80,
        meta:150
    },

    {
        item:4,
        produto:"Produto 04",
        lote:"Lote 004",
        produzido:95,
        meta:200
    },

    {
        item:5,
        produto:"Produto 05",
        lote:"Lote 005",
        produzido:35,
        meta:40
    },

    {
        item:6,
        produto:"Produto 06",
        lote:"Lote 006",
        produzido:0,
        meta:0
    },

    {
        item:7,
        produto:"Produto 07",
        lote:"Lote 007",
        produzido:0,
        meta:0
    },

    {
        item:8,
        produto:"Produto 08",
        lote:"Lote 008",
        produzido:0,
        meta:0
    },

    {
        item:9,
        produto:"Produto 09",
        lote:"Lote 009",
        produzido:0,
        meta:0
    },

    {
        item:10,
        produto:"Produto 10",
        lote:"Lote 010",
        produzido:0,
        meta:0
    }

];


/* =========================================================
   FORMATAÇÃO DE NÚMEROS
========================================================= */

function numero(valor){

    return Number(valor || 0)
        .toLocaleString("pt-BR");

}


/* =========================================================
   STATUS DO ITEM
========================================================= */

function calcularStatus(produzido, meta){

    if(!meta || meta <= 0){

        return {
            texto:"SEM META",
            classe:"status-sem-meta",
            cor:"cor-sem-meta"
        };

    }


    const percentual =
        (produzido / meta) * 100;


    if(percentual >= 100){

        return {
            texto:"META ATINGIDA",
            classe:"status-meta",
            cor:"cor-meta"
        };

    }


    if(percentual >= 80){

        return {
            texto:"EM ANDAMENTO",
            classe:"status-andamento",
            cor:"cor-andamento"
        };

    }


    if(percentual >= 50){

        return {
            texto:"ATENÇÃO",
            classe:"status-atencao",
            cor:"cor-atencao"
        };

    }


    return {

        texto:"ABAIXO DA META",

        classe:"status-baixo",

        cor:"cor-baixo"

    };

}


/* =========================================================
   CRIA CÍRCULO
========================================================= */

function criarCirculo(item){

    const produzido =
        Number(item.produzido || 0);

    const meta =
        Number(item.meta || 0);


    let percentual = 0;


    if(meta > 0){

        percentual =
            (produzido / meta) * 100;

    }


    /*
       Não deixamos a barra passar de 100%.
    */

    const percentualVisual =
        Math.min(percentual,100);


    const status =
        calcularStatus(produzido,meta);


    const raio = 52;

    const circunferencia =
        2 * Math.PI * raio;


    const deslocamento =
        circunferencia -
        (percentualVisual / 100) *
        circunferencia;


    const percentualTexto =
        meta > 0
        ? percentual.toFixed(1).replace(".",",") + "%"
        : "—";


    return `

        <div class="circular">

            <svg
                viewBox="0 0 120 120">

                <circle
                    class="trilha"
                    cx="60"
                    cy="60"
                    r="${raio}">
                </circle>

                <circle
                    class="progresso ${status.cor}"
                    cx="60"
                    cy="60"
                    r="${raio}"
                    stroke-dasharray="${circunferencia}"
                    stroke-dashoffset="${deslocamento}">
                </circle>

            </svg>


            <div class="circular-centro">

                <div class="percentual">
                    ${percentualTexto}
                </div>

                <div class="quantidade">
                    ${numero(produzido)} / ${numero(meta)}
                </div>

                <div class="meta">
                    produzido / meta
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   CRIA CARD
========================================================= */

function criarCard(item){

    const produzido =
        Number(item.produzido || 0);

    const meta =
        Number(item.meta || 0);


    const pendente =
        Math.max(meta - produzido,0);


    const status =
        calcularStatus(produzido,meta);


    return `

        <section class="card">


            <div class="card-topo">

                <div class="item-numero">

                    ITEM ${item.item}

                </div>


                <div class="status-pequeno">

                    ${status.texto}

                </div>

            </div>


            <div class="produto">

                ${item.produto}

            </div>


            <div class="lote">

                ${item.lote}

            </div>


            <div class="grafico">

                ${criarCirculo(item)}

            </div>


            <div class="card-bottom">

                <div class="situacao ${status.classe}">

                    ${status.texto}

                </div>


                <div class="pendente">

                    Pendente:
                    ${numero(pendente)}

                </div>

            </div>


        </section>

    `;

}


/* =========================================================
   CARREGA OS ITENS
========================================================= */

function carregarPainel(){

    const container =
        document.getElementById("listaItens");


    container.innerHTML =
        dados.map(criarCard).join("");


    atualizarResumo();

}


/* =========================================================
   RESUMO GERAL
========================================================= */

function atualizarResumo(){

    let metaTotal = 0;

    let produzidoTotal = 0;


    dados.forEach(item => {

        metaTotal +=
            Number(item.meta || 0);

        produzidoTotal +=
            Number(item.produzido || 0);

    });


    const pendentesTotal =
        Math.max(
            metaTotal - produzidoTotal,
            0
        );


    const progresso =
        metaTotal > 0
        ? (produzidoTotal / metaTotal) * 100
        : 0;


    document.getElementById(
        "metaTotal"
    ).textContent =
        numero(metaTotal);


    document.getElementById(
        "produzidoTotal"
    ).textContent =
        numero(produzidoTotal);


    document.getElementById(
        "pendentesTotal"
    ).textContent =
        numero(pendentesTotal);


    document.getElementById(
        "progressoTotal"
    ).textContent =
        progresso.toFixed(1)
        .replace(".",",") + "%";

}


/* =========================================================
   DATA E HORA
========================================================= */

function atualizarDataHora(){

    const agora =
        new Date();


    const data =
        agora.toLocaleDateString(
            "pt-BR",
            {
                weekday:"long",
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );


    const hora =
        agora.toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );


    document.getElementById(
        "dataAtual"
    ).textContent = data;


    document.getElementById(
        "horaAtual"
    ).textContent = hora;

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

carregarPainel();

atualizarDataHora();


/* Atualiza o relógio */

setInterval(
    atualizarDataHora,
    1000
);


/*
   Mais tarde podemos colocar aqui
   a atualização dos dados da planilha.

   Por enquanto não mexemos nisso,
   para primeiro aprovarmos a aparência.
*/

</script>


</body>

</html>
