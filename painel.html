<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Painel de Produção - Pacote</title>

<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #031b36 0%,
            #05284b 50%,
            #03172d 100%
        );

    color:#ffffff;

    overflow:hidden;
}


/* =========================================================
   PAINEL
========================================================= */

.painel{

    width:100vw;
    height:100vh;

    padding:14px 22px 10px;

    display:flex;
    flex-direction:column;

    gap:10px;

}


/* =========================================================
   CABEÇALHO
========================================================= */

.cabecalho{

    min-height:86px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:
        1px solid
        rgba(43,145,220,.45);

    padding:0 10px 10px;

}


/* =========================================================
   IDENTIFICAÇÃO
========================================================= */

.identificacao{

    display:flex;

    align-items:center;

    gap:22px;

    min-width:0;

}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:8px;

    white-space:nowrap;

}

.logo-simbolo{

    width:42px;
    height:42px;

    border-radius:9px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #1688e8,
            #0757a4
        );

    font-size:23px;

    box-shadow:
        0 4px 14px
        rgba(0,120,230,.25);

}

.logo-texto{

    font-size:28px;

    font-weight:800;

    letter-spacing:-1px;

}

.logo-texto span{

    color:#29a4ff;

}


/* SEPARADOR */

.separador{

    width:1px;

    height:58px;

    background:
        rgba(255,255,255,.25);

}


/* TÍTULO */

.titulo-area{

    min-width:0;

}

.titulo{

    font-size:30px;

    font-weight:900;

    letter-spacing:.3px;

    white-space:nowrap;

}

.subtitulo{

    margin-top:4px;

    font-size:17px;

    font-weight:700;

    color:#8fc9f5;

}


/* =========================================================
   DATA / HORA / ONLINE
========================================================= */

.informacoes{

    display:flex;

    align-items:center;

    gap:20px;

    white-space:nowrap;

}

.info-data{

    display:flex;

    flex-direction:column;

    align-items:flex-end;

}

.data{

    font-size:17px;

    font-weight:800;

}

.dia{

    margin-top:2px;

    font-size:11px;

    color:#8fa7bd;

}

.info-hora{

    padding-left:18px;

    border-left:
        1px solid
        rgba(255,255,255,.25);

}

.hora{

    font-size:18px;

    font-weight:800;

}

.hora-label{

    margin-top:2px;

    font-size:10px;

    color:#8fa7bd;

}

.online{

    display:flex;

    align-items:center;

    gap:8px;

    padding-left:16px;

    border-left:
        1px solid
        rgba(255,255,255,.25);

    color:#21df83;

    font-size:13px;

    font-weight:900;

}

.online-ponto{

    width:13px;
    height:13px;

    border-radius:50%;

    background:#21df83;

    box-shadow:
        0 0 12px
        rgba(33,223,131,.75);

}


/* =========================================================
   RESUMO
========================================================= */

.resumo{

    display:grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap:12px;

    min-height:82px;

}

.resumo-box{

    position:relative;

    overflow:hidden;

    border-radius:12px;

    border:
        1px solid
        rgba(62,157,224,.35);

    background:
        linear-gradient(
            135deg,
            rgba(5,46,82,.96),
            rgba(4,32,59,.96)
        );

    padding:10px 17px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.15);

}

.resumo-box::after{

    content:"";

    position:absolute;

    width:70px;
    height:70px;

    right:-25px;
    top:-25px;

    border-radius:50%;

    background:
        rgba(34,146,231,.08);

}

.resumo-label{

    font-size:11px;

    color:#8eabc4;

    font-weight:800;

    letter-spacing:.7px;

    text-transform:uppercase;

}

.resumo-valor{

    margin-top:2px;

    font-size:27px;

    font-weight:900;

    letter-spacing:.2px;

}

.resumo-unidade{

    font-size:10px;

    color:#7893ab;

}


/* =========================================================
   BARRA DE PROGRESSO GERAL
========================================================= */

.barra-geral{

    width:100%;

    height:7px;

    margin-top:6px;

    border-radius:10px;

    background:#123d64;

    overflow:hidden;

}

.barra-geral-preenchida{

    width:0%;

    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #18bb72,
            #20df86
        );

    transition:
        width .7s ease;

}


/* =========================================================
   ÁREA DOS ITENS
========================================================= */

.itens{

    flex:1;

    min-height:0;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    grid-template-rows:
        repeat(2,minmax(0,1fr));

    gap:10px;

}


/* =========================================================
   CARD
========================================================= */

.card{

    position:relative;

    min-width:0;
    min-height:0;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    border-radius:13px;

    border:
        1px solid
        rgba(47,143,211,.38);

    background:
        linear-gradient(
            145deg,
            rgba(5,43,76,.98),
            rgba(3,29,53,.98)
        );

    box-shadow:
        0 4px 13px
        rgba(0,0,0,.18);

    padding:10px 12px;

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}

.card:hover{

    transform:translateY(-2px);

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.25);

}


/* =========================================================
   TOPO CARD
========================================================= */

.card-topo{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:5px;

    min-height:27px;

}

.item-numero{

    font-size:17px;

    font-weight:900;

}

.status-pequeno{

    max-width:125px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    padding:4px 7px;

    border-radius:20px;

    font-size:9px;

    font-weight:900;

}


/* =========================================================
   GRÁFICO
========================================================= */

.grafico{

    flex:1;

    min-height:0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:2px 0;

}


/* =========================================================
   VELOCÍMETRO
========================================================= */

.circular{

    position:relative;

    width:min(
        19vh,
        145px
    );

    height:min(
        19vh,
        145px
    );

    min-width:95px;

    min-height:95px;

    max-width:145px;

    max-height:145px;

}

.circular svg{

    width:100%;
    height:100%;

    transform:rotate(-90deg);

}

.circular circle{

    fill:none;

    stroke-width:10;

}

.trilha{

    stroke:#284968;

}

.progresso{

    stroke-linecap:round;

    transition:
        stroke-dashoffset .8s ease;

}


/* =========================================================
   TEXTO CENTRAL
========================================================= */

.circular-centro{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

}

.percentual{

    font-size:25px;

    font-weight:900;

    line-height:1;

}

.quantidade{

    margin-top:5px;

    font-size:11px;

    font-weight:800;

    color:#e5f0f8;

}

.meta{

    margin-top:2px;

    font-size:8px;

    color:#7592aa;

}


/* =========================================================
   INFORMAÇÕES DO PRODUTO
========================================================= */

.produto-area{

    border-top:
        1px solid
        rgba(77,143,188,.22);

    padding-top:6px;

    min-height:39px;

}

.produto{

    display:flex;

    align-items:center;

    gap:7px;

    font-size:12px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.produto-icone{

    color:#8bc9f5;

    font-size:13px;

}

.lote{

    margin-top:3px;

    display:flex;

    align-items:center;

    gap:7px;

    font-size:11px;

    color:#9bb4c9;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.lote-icone{

    color:#8bc9f5;

}


/* =========================================================
   PENDENTE
========================================================= */

.card-bottom{

    margin-top:6px;

    padding:6px 9px;

    border-radius:9px;

    background:
        rgba(11,69,113,.42);

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:10px;

}

.pendente-label{

    color:#a9c0d3;

}

.pendente-valor{

    font-size:13px;

    font-weight:900;

}


/* =========================================================
   STATUS
========================================================= */

.status-baixo{

    color:#ff5b5b;

}

.status-atencao{

    color:#ffc331;

}

.status-andamento{

    color:#3da9ff;

}

.status-meta{

    color:#20df83;

}

.status-sem-meta{

    color:#8d9baa;

}


/* =========================================================
   FUNDOS DOS STATUS
========================================================= */

.fundo-baixo{

    background:
        rgba(225,40,40,.88);

    color:#fff;

}

.fundo-atencao{

    background:
        rgba(205,143,0,.90);

    color:#fff;

}

.fundo-andamento{

    background:
        rgba(0,105,205,.88);

    color:#fff;

}

.fundo-meta{

    background:
        rgba(0,150,75,.88);

    color:#fff;

}

.fundo-sem-meta{

    background:
        rgba(87,103,119,.85);

    color:#fff;

}


/* =========================================================
   CORES DO CÍRCULO
========================================================= */

.cor-baixo{

    stroke:#ff4141;

}

.cor-atencao{

    stroke:#ffba16;

}

.cor-andamento{

    stroke:#189cff;

}

.cor-meta{

    stroke:#20df83;

}

.cor-sem-meta{

    stroke:#52677b;

}


/* =========================================================
   RODAPÉ
========================================================= */

.rodape{

    height:19px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 4px;

    color:#6f8ca5;

    font-size:9px;

}

.rodape-esquerda{

    display:flex;

    align-items:center;

    gap:7px;

}

.rodape-ponto{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#20df83;

}

.rodape-direita{

    display:flex;

    align-items:center;

    gap:6px;

}


/* =========================================================
   TELAS MENORES
========================================================= */

@media(max-width:1200px){

    body{
        overflow:auto;
    }

    .painel{

        height:auto;

        min-height:100vh;

    }

    .itens{

        grid-template-columns:
            repeat(3,minmax(0,1fr));

        grid-template-rows:none;

    }

    .card{

        min-height:310px;

    }

    .cabecalho{

        min-height:auto;

    }

}


/* =========================================================
   TABLET / CELULAR
========================================================= */

@media(max-width:800px){

    .painel{

        padding:10px;

        gap:9px;

    }

    .cabecalho{

        padding-bottom:8px;

    }

    .logo{

        display:none;

    }

    .separador{

        display:none;

    }

    .titulo{

        font-size:21px;

    }

    .subtitulo{

        font-size:13px;

    }

    .informacoes{

        gap:10px;

    }

    .online{

        padding-left:8px;

    }

    .resumo{

        grid-template-columns:
            1fr 1fr;

    }

    .itens{

        grid-template-columns:
            1fr 1fr;

    }

    .card{

        min-height:280px;

    }

}


/* =========================================================
   CELULAR PEQUENO
========================================================= */

@media(max-width:500px){

    body{

        overflow:auto;

    }

    .cabecalho{

        align-items:flex-start;

    }

    .informacoes{

        display:none;

    }

    .titulo{

        font-size:20px;

    }

    .subtitulo{

        font-size:12px;

    }

    .resumo{

        gap:7px;

    }

    .resumo-box{

        min-height:68px;

        padding:8px 11px;

    }

    .resumo-valor{

        font-size:20px;

    }

    .itens{

        grid-template-columns:
            1fr;

    }

    .card{

        min-height:300px;

    }

    .rodape{

        height:auto;

        min-height:25px;

    }

}


/* =========================================================
   MODO TELA CHEIA
========================================================= */

:fullscreen .painel{

    padding:15px 25px 10px;

}

</style>

</head>


<body>


<div class="painel">


    <!-- =====================================================
         CABEÇALHO

    <header class="cabecalho">

                </div>

            </div>

        <div class="resumo-box">

            <div class="resumo-label">

            </div>

            <div
                class="resumo-valor"
                id="produzidoTotal">

            </div>

            <div class="resumo-unidade">

            </div>

        </div>



        <div class="resumo-box">

            <div class="resumo-label">

            </div>

<script>

/* =========================================================
   CONFIGURAÇÃO DO APPS SCRIPT
========================================================= */

const URL_API =
    "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

const SETOR_PAINEL = "PACOTE";

const INTERVALO_ATUALIZACAO = 15000;


/* =========================================================
   DADOS
========================================================= */

let dados = [];

let carregando = false;


/* =========================================================
   TRATAMENTO DE NÚMEROS
========================================================= */

function parseNumero(valor){

    if(typeof valor === "number"){

        return isFinite(valor)
            ? valor
            : 0;

    }

    if(valor === null || valor === undefined){

        return 0;

    }

    let texto =
        String(valor)
            .trim();

    if(!texto){

        return 0;

    }

    /*
       Trata formatos:

       1234
       1.234
       1.234,56
       1234,56
    */

    if(
        texto.includes(",")
    ){

        texto =
            texto
                .replace(/\./g,"")
                .replace(",", ".");

    }

    const numeroConvertido =
        Number(texto);

    return isNaN(numeroConvertido)
        ? 0
        : numeroConvertido;

}


/* =========================================================
   FORMATAÇÃO
========================================================= */

function numero(valor){

    return Number(valor || 0)
        .toLocaleString(
            "pt-BR",
            {
                maximumFractionDigits:2
            }
        );

}


/* =========================================================
   ESCAPA TEXTO HTML
========================================================= */

function escaparHtml(valor){

    return String(
        valor === null ||
        valor === undefined
            ? ""
            : valor
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   STATUS
========================================================= */

function calcularStatus(
    produzido,
    meta
){

    if(!meta || meta <= 0){

        return {

            texto:"SEM META",

            classe:"status-sem-meta",

            fundo:"fundo-sem-meta",

            cor:"cor-sem-meta"

        };

    }


    const percentual =
        (produzido / meta) * 100;


    if(percentual >= 100){

        return {

            texto:"META ATINGIDA",

            classe:"status-meta",

            fundo:"fundo-meta",

            cor:"cor-meta"

        };

    }


    if(percentual >= 80){

        return {

            texto:"EM ANDAMENTO",

            classe:"status-andamento",

            fundo:"fundo-andamento",

            cor:"cor-andamento"

        };

    }


    if(percentual >= 50){

        return {

            texto:"ATENÇÃO",

            classe:"status-atencao",

            fundo:"fundo-atencao",

            cor:"cor-atencao"

        };

    }


    return {

        texto:"ABAIXO DA META",

        classe:"status-baixo",

        fundo:"fundo-baixo",

        cor:"cor-baixo"

    };

}


/* =========================================================
   CÍRCULO
========================================================= */

function criarCirculo(item){

    const produzido =
        parseNumero(
            item.produzido
        );

    const meta =
        parseNumero(
            item.meta
        );


    let percentual = 0;


    if(meta > 0){

        percentual =
            (
                produzido /
                meta
            ) * 100;

    }


    const percentualVisual =
        Math.min(
            Math.max(
                percentual,
                0
            ),
            100
        );


    const status =
        calcularStatus(
            produzido,
            meta
        );


    const raio = 52;


    const circunferencia =
        2 *
        Math.PI *
        raio;


    const deslocamento =
        circunferencia -
        (
            percentualVisual /
            100
        ) *
        circunferencia;


    const percentualTexto =
        meta > 0
        ?
        percentual
            .toFixed(0)
            .replace(".",",")
            + "%"
        :
        "0%";


    return `

        <div class="circular">

            <svg
                viewBox="0 0 120 120">

                <circle
                    class="trilha"
                    cx="60"
                    cy="60"
                    r="${raio}">
                </circle>


                <circle
                    class="
                        progresso
                        ${status.cor}
                    "
                    cx="60"
                    cy="60"
                    r="${raio}"
                    stroke-dasharray="${circunferencia}"
                    stroke-dashoffset="${deslocamento}">
                </circle>

            </svg>


            <div class="circular-centro">

                <div class="percentual">

                    ${percentualTexto}

                </div>


                <div class="quantidade">

                    ${numero(produzido)}
                    /
                    ${numero(meta)}

                </div>


                <div class="meta">

                    produzido / meta

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   CARD
========================================================= */

function criarCard(item){

    const produzido =
        parseNumero(
            item.produzido
        );

    const meta =
        parseNumero(
            item.meta
        );


    const pendente =
        Math.max(
            meta -
            produzido,
            0
        );


    const status =
        calcularStatus(
            produzido,
            meta
        );


    const numeroItem =
        String(
            item.item || ""
        )
        .padStart(
            2,
            "0"
        );


    const produto =
        escaparHtml(
            item.produto || "—"
        );


    const lote =
        escaparHtml(
            item.lote || "—"
        );


    return `

        <section class="card">

            <div class="card-topo">

                <div class="item-numero">

                    ITEM ${numeroItem}

                </div>


                <div
                    class="
                        status-pequeno
                        ${status.fundo}
                    "
                >

                    ${status.texto}

                </div>

            </div>


            <div class="grafico">

                ${criarCirculo(item)}

            </div>


            <div class="produto-area">

                <div class="produto">

                    <span class="produto-icone">
                        ◈
                    </span>

                    <span>
                        ${produto}
                    </span>

                </div>


                <div class="lote">

                    <span class="lote-icone">
                        ◇
                    </span>

                    <span>
                        ${lote}
                    </span>

                </div>

            </div>


            <div class="card-bottom">

                <span class="pendente-label">
                    Pendente
                </span>


                <span class="pendente-valor">

                    ${numero(pendente)}

                </span>

            </div>

        </section>

    `;

}


/* =========================================================
   GARANTE OS 10 ITENS
========================================================= */

function normalizarItens(itensRecebidos){

    const mapa = new Map();


    (Array.isArray(itensRecebidos)
        ? itensRecebidos
        : []
    ).forEach(item => {

        const numeroItem =
            parseInt(
                item.item,
                10
            );


        if(
            numeroItem >= 1 &&
            numeroItem <= 10
        ){

            mapa.set(
                numeroItem,
                {

                    item:numeroItem,

                    produto:
                        item.produto || "",

                    lote:
                        item.lote || "",

                    produzido:
                        parseNumero(
                            item.produzido
                        ),

                    meta:
                        parseNumero(
                            item.meta
                        ),

                    pendente:
                        parseNumero(
                            item.pendente
                        ),

                    percentual:
                        parseNumero(
                            item.percentual
                        )

                }
            );

        }

    });


    const resultado = [];


    for(
        let i = 1;
        i <= 10;
        i++
    ){

        if(mapa.has(i)){

            resultado.push(
                mapa.get(i)
            );

        }
        else{

            resultado.push({

                item:i,

                produto:"",

                lote:"",

                produzido:0,

                meta:0,

                pendente:0,

                percentual:0

            });

        }

    }


    return resultado;

}


/* =========================================================
   CARREGA PAINEL
========================================================= */

function carregarPainel(){

    const container =
        document.getElementById(
            "listaItens"
        );


    if(!container){

        return;

    }


    /*
       IMPORTANTE:

       Sempre renderiza 10 cards.
       Assim um item vazio da planilha
       não faz o painel ficar com apenas
       9, 8, 7 etc.
    */

    container.innerHTML =
        dados
            .map(
                criarCard
            )
            .join("");


    atualizarResumo();

}


/* =========================================================
   RESUMO GERAL
========================================================= */

function atualizarResumo(
    resumoServidor = null
){

    let metaTotal = 0;

    let produzidoTotal = 0;


    dados.forEach(item => {

        metaTotal +=
            parseNumero(
                item.meta
            );

        produzidoTotal +=
            parseNumero(
                item.produzido
            );

    });


    /*
       Se o Apps Script enviou o resumo,
       usamos o resumo oficial retornado
       pela função obterDadosPainel().
    */

    if(
        resumoServidor &&
        typeof resumoServidor === "object"
    ){

        if(
            resumoServidor.metaTotal !==
            undefined
        ){

            metaTotal =
                parseNumero(
                    resumoServidor.metaTotal
                );

        }


        if(
            resumoServidor.produzidoTotal !==
            undefined
        ){

            produzidoTotal =
                parseNumero(
                    resumoServidor.produzidoTotal
                );

        }

    }


    const pendentesTotal =
        Math.max(
            metaTotal -
            produzidoTotal,
            0
        );


    let progresso = 0;


    if(metaTotal > 0){

        progresso =
            (
                produzidoTotal /
                metaTotal
            ) * 100;

    }


    document.getElementById(
        "metaTotal"
    ).textContent =
        numero(metaTotal);


    document.getElementById(
        "produzidoTotal"
    ).textContent =
        numero(produzidoTotal);


    document.getElementById(
        "pendentesTotal"
    ).textContent =
        numero(pendentesTotal);


    document.getElementById(
        "progressoTotal"
    ).textContent =
        progresso
            .toFixed(1)
            .replace(".",",")
            + "%";


    document.getElementById(
        "barraGeral"
    ).style.width =
        Math.min(
            Math.max(
                progresso,
                0
            ),
            100
        )
        + "%";

}

/* =========================================================
   CARREGAR DADOS REAIS DO APPS SCRIPT
========================================================= */

async function carregarDadosReais(){

    /*
       Evita duas requisições simultâneas
       caso a internet esteja lenta.
    */

    if(carregando){

        return;

    }


    carregando = true;


    try{

        const url =
            URL_API +
            "?painel=" +
            encodeURIComponent(
                SETOR_PAINEL
            ) +
            "&_=" +
            Date.now();


        console.log(
            "Consultando painel:",
            url
        );


        const resposta =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!resposta.ok){

            throw new Error(
                "Erro HTTP: " +
                resposta.status
            );

        }


        const resultado =
            await resposta.json();


        console.log(
            "Resposta do Apps Script:",
            resultado
        );


        if(
            !resultado ||
            resultado.sucesso !== true
        ){

            throw new Error(
                resultado &&
                resultado.erro
                ?
                resultado.erro
                :
                "Resposta inválida do Apps Script."
            );

        }


        /*
           NORMALIZA OS 10 ITENS
        */

        dados =
            normalizarItens(
                resultado.itens
            );


        /*
           RENDERIZA
        */

        carregarPainel();


        /*
           ATUALIZA RESUMO COM OS DADOS
           OFICIAIS DO SERVIDOR
        */

        atualizarResumo(
            resultado.resumo
        );


        /*
           DATA DO PAINEL
        */

        if(resultado.data){

            document.getElementById(
                "dataAtual"
            ).textContent =
                resultado.data;

        }


        /*
           ATUALIZAÇÃO DO SERVIDOR
        */

        if(
            resultado.atualizacao
        ){

            const label =
                document.querySelector(
                    ".hora-label"
                );


            label.textContent =
                "Servidor: " +
                resultado.atualizacao;

        }


        /*
           ONLINE
        */

        definirOnline();


    }
    catch(erro){

        console.error(
            "Erro ao carregar painel:",
            erro
        );


        definirOffline();

    }
    finally{

        carregando = false;

    }

}


/* =========================================================
   DATA E HORA LOCAL
========================================================= */

function atualizarDataHora(){

    const agora =
        new Date();


    const data =
        agora.toLocaleDateString(
            "pt-BR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );


    const dia =
        agora.toLocaleDateString(
            "pt-BR",
            {
                weekday:"long"
            }
        );


    const hora =
        agora.toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );


    document.getElementById(
        "dataAtual"
    ).textContent =
        data;


    document.getElementById(
        "diaAtual"
    ).textContent =
        dia;


    document.getElementById(
        "horaAtual"
    ).textContent =
        hora;

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        atualizarDataHora();

        carregarDadosReais();

    }
);


/* =========================================================
   RELÓGIO
========================================================= */

setInterval(
    atualizarDataHora,
    1000
);


/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA
========================================================= */

setInterval(
    carregarDadosReais,
    INTERVALO_ATUALIZACAO
);
