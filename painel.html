<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Painel de Produção - Pacote</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #08111c;
      color: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #painel {
      width: 100vw;
      height: 100vh;
      padding: 1.2vh 1.2vw;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at top center,
          #14273b 0%,
          #0b1623 45%,
          #08111c 100%
        );
    }

    .cabecalho {
      height: 11vh;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 1.5vw;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #122338,
          #0c1827
        );

      border:
        1px solid
        rgba(255,255,255,0.08);

      box-shadow:
        0 8px 30px
        rgba(0,0,0,0.30);

      flex-shrink: 0;
    }

    .titulo-area {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .titulo {
      font-size: clamp(
        30px,
        3.2vw,
        62px
      );

      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
    }

    .subtitulo {
      margin-top: 8px;

      font-size: clamp(
        14px,
        1.15vw,
        23px
      );

      color: #91a8bd;
      font-weight: 600;
    }

    .data-area {
      text-align: right;

      display: flex;
      flex-direction: column;
      align-items: flex-end;

      gap: 5px;
    }

    .data-label {
      font-size: clamp(
        12px,
        0.9vw,
        18px
      );

      color: #71889d;
      text-transform: uppercase;
      font-weight: 700;
    }

    .data {
      font-size: clamp(
        20px,
        1.7vw,
        34px
      );

      font-weight: 900;
    }

    .resumo {
      height: 15vh;

      margin-top: 1.2vh;

      display: grid;
      grid-template-columns:
        repeat(4, 1fr);

      gap: 1vw;

      flex-shrink: 0;
    }

    .resumo-card {
      min-width: 0;

      border-radius: 18px;

      padding: 1.1vh 1vw;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      background:
        linear-gradient(
          145deg,
          #14283d,
          #0d1c2c
        );

      border:
        1px solid
        rgba(255,255,255,0.08);

      box-shadow:
        0 7px 22px
        rgba(0,0,0,0.24);
    }

    .resumo-label {
      font-size: clamp(
        12px,
        0.95vw,
        20px
      );

      color: #91a8bd;

      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.7px;
    }

    .resumo-valor {
      margin-top: 8px;

      font-size: clamp(
        27px,
        2.5vw,
        48px
      );

      font-weight: 900;
      line-height: 1;
    }

    .resumo-card.progresso
    .resumo-valor {
      font-size: clamp(
        27px,
        2.3vw,
        46px
      );
    }

    #itens {
      flex: 1;
      min-height: 0;

      margin-top: 1.2vh;

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      grid-template-rows:
        repeat(2, 1fr);

      gap: 0.9vw;

      overflow: hidden;
    }

    .card {
      min-width: 0;
      min-height: 0;

      position: relative;

      display: flex;
      flex-direction: column;

      padding:
        1.1vh 0.9vw;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          #13263a,
          #0c1a29
        );

      border:
        1px solid
        rgba(255,255,255,0.09);

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.28);

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 5px;

      background: #39556d;
    }

    .card.concluido::before {
      background: #3bd17f;
    }

    .card.andamento::before {
      background: #f2b84b;
    }

    .card.atrasado::before {
      background: #e95d67;
    }

    .card-topo {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 8px;

      flex-shrink: 0;
    }

    .numero {
      width: 2.1vw;
      min-width: 30px;

      height: 2.1vw;
      min-height: 30px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #213c55;

      font-size: clamp(
        13px,
        1vw,
        21px
      );

      font-weight: 900;
    }

    .status {
      padding:
        5px 10px;

      border-radius: 20px;

      background: #23394d;

      color: #9db0c2;

      font-size: clamp(
        9px,
        0.68vw,
        14px
      );

      font-weight: 900;

      text-transform: uppercase;

      white-space: nowrap;
    }

    .concluido .status {
      background: rgba(59,209,127,0.15);
      color: #5ee695;
    }

    .andamento .status {
      background: rgba(242,184,75,0.15);
      color: #f7c665;
    }

    .atrasado .status {
      background: rgba(233,93,103,0.15);
      color: #f07881;
    }

    .produto {
      margin-top: 0.9vh;

      min-height: 3.4vh;

      font-size: clamp(
        16px,
        1.15vw,
        25px
      );

      line-height: 1.05;

      font-weight: 900;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .produto.vazio {
      color: #53697d;
      font-weight: 700;
    }

    .lote {
      margin-top: 4px;

      font-size: clamp(
        11px,
        0.72vw,
        15px
      );

      color: #839aae;
      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .conteudo-card {
      flex: 1;
      min-height: 0;

      margin-top: 0.8vh;

      display: flex;

      align-items: center;

      gap: 0.8vw;
    }

    .circulo-area {
      width: 6.2vw;
      min-width: 65px;

      aspect-ratio: 1 / 1;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .circulo {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      position: relative;

      background:
        conic-gradient(
          #506b82 0deg,
          #506b82 0deg,
          #1a2b3b 0deg,
          #1a2b3b 360deg
        );
    }

    .circulo::after {
      content: "";

      position: absolute;

      width: 72%;
      height: 72%;

      border-radius: 50%;

      background: #0e1e2d;

      box-shadow:
        inset 0 0 10px
        rgba(0,0,0,0.35);
    }

    .percentual {
      position: relative;

      z-index: 2;

      font-size: clamp(
        16px,
        1.2vw,
        25px
      );

      font-weight: 900;
    }

    .numeros {
      flex: 1;
      min-width: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;

      gap: 0.7vh;
    }

    .linha-numero {
      display: flex;

      align-items: baseline;

      justify-content: space-between;

      gap: 5px;
    }

    .linha-label {
      font-size: clamp(
        10px,
        0.67vw,
        14px
      );

      color: #7890a4;

      font-weight: 800;

      text-transform: uppercase;
    }

    .linha-valor {
      font-size: clamp(
        16px,
        1.18vw,
        25px
      );

      font-weight: 900;

      white-space: nowrap;
    }

    .barra-container {
      margin-top: 0.6vh;

      height: 7px;

      width: 100%;

      border-radius: 10px;

      overflow: hidden;

      background: #1d3041;

      flex-shrink: 0;
    }

    .barra {
      height: 100%;

      width: 0%;

      border-radius: 10px;

      transition:
        width 0.7s ease;
    }

    .rodape {
      height: 3.2vh;

      margin-top: 0.6vh;

      display: flex;

      align-items: center;

      justify-content: space-between;

      color: #536b7f;

      font-size: clamp(
        9px,
        0.65vw,
        13px
      );

      font-weight: 700;

      flex-shrink: 0;
    }

    #statusApi {
      display: flex;

      align-items: center;

      gap: 7px;
    }

    #statusBolinha {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #e95d67;
    }

    #statusBolinha.ok {
      background: #3bd17f;
    }

    #statusBolinha.carregando {
      background: #f2b84b;
    }

    #erro {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background:
        rgba(5,12,20,0.96);

      z-index: 100;
    }

    #erro.visivel {
      display: flex;
    }

    .erro-box {
      width: min(
        700px,
        85vw
      );

      padding: 40px;

      border-radius: 20px;

      text-align: center;

      background: #122337;

      border:
        1px solid
        rgba(255,255,255,0.1);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,0.5);
    }

    .erro-titulo {
      font-size: 30px;

      font-weight: 900;

      margin-bottom: 15px;
    }

    .erro-texto {
      color: #9aafc1;

      line-height: 1.5;

      font-size: 17px;
    }

  </style>

</head>

<body>

  <div id="painel">

    <header class="cabecalho">

      <div class="titulo-area">

        <div class="titulo">
          PACOTE
        </div>

        <div class="subtitulo">
          Painel de Produção
        </div>

      </div>

      <div class="data-area">

        <div class="data-label">
          Data do painel
        </div>

        <div
          id="dataPainel"
          class="data"
        >
          --
        </div>

      </div>

    </header>

    <section class="resumo">

      <div class="resumo-card">

        <div class="resumo-label">
          Meta total
        </div>

        <div
          id="metaTotal"
          class="resumo-valor"
        >
          0
        </div>

      </div>

      <div class="resumo-card">

        <div class="resumo-label">
          Produzido
        </div>

        <div
          id="produzidoTotal"
          class="resumo-valor"
        >
          0
        </div>

      </div>

      <div class="resumo-card">

        <div class="resumo-label">
          Pendente
        </div>

        <div
          id="pendenteTotal"
          class="resumo-valor"
        >
          0
        </div>

      </div>

      <div class="resumo-card progresso">

        <div class="resumo-label">
          Progresso geral
        </div>

        <div
          id="progressoGeral"
          class="resumo-valor"
        >
          0%
        </div>

      </div>

    </section>

    <main id="itens"></main>

    <footer class="rodape">

      <div id="statusApi">

        <span
          id="statusBolinha"
          class="carregando"
        ></span>

        <span id="statusTexto">
          Carregando dados...
        </span>

      </div>

      <div id="ultimaAtualizacao">
        --
      </div>

    </footer>

  </div>

  <div id="erro">

    <div class="erro-box">

      <div class="erro-titulo">
        Não foi possível carregar o painel
      </div>

      <div
        id="erroTexto"
        class="erro-texto"
      >
        Aguardando conexão com o servidor...
      </div>

    </div>

  </div>

  <script>

    // ==========================================================
    // CONFIGURAÇÃO
    // ==========================================================

    const URL_API =
      "https://script.google.com/macros/s/AKfycbzaPKDfmkvKfBjANAulitSsJQaxDTzuzwRx0Vl147be4Z33V-CDtv8zRuo7iOx2JKpL/exec";

    const SETOR =
      "PACOTE";

    const INTERVALO_MS =
      15000;

    const TEMPO_LIMITE_MS =
      12000;


    // ==========================================================
    // ELEMENTOS
    // ==========================================================

    const elementos = {

      itens:
        document.getElementById(
          "itens"
        ),

      data:
        document.getElementById(
          "dataPainel"
        ),

      metaTotal:
        document.getElementById(
          "metaTotal"
        ),

      produzidoTotal:
        document.getElementById(
          "produzidoTotal"
        ),

      pendenteTotal:
        document.getElementById(
          "pendenteTotal"
        ),

      progressoGeral:
        document.getElementById(
          "progressoGeral"
        ),

      statusBolinha:
        document.getElementById(
          "statusBolinha"
        ),

      statusTexto:
        document.getElementById(
          "statusTexto"
        ),

      ultimaAtualizacao:
        document.getElementById(
          "ultimaAtualizacao"
        ),

      erro:
        document.getElementById(
          "erro"
        ),

      erroTexto:
        document.getElementById(
          "erroTexto"
        )

    };


    // ==========================================================
    // FORMATAÇÃO DE NÚMEROS
    // ==========================================================

    function formatarNumero(
      valor
    ) {

      const numero =
        Number(valor) || 0;

      return numero.toLocaleString(
        "pt-BR",
        {
          maximumFractionDigits: 2
        }
      );
    }


    // ==========================================================
    // FORMATA PERCENTUAL
    // ==========================================================

    function formatarPercentual(
      valor
    ) {

      let numero =
        Number(valor) || 0;

      if (
        !isFinite(numero)
      ) {
        numero = 0;
      }

      return numero.toLocaleString(
        "pt-BR",
        {
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }
      ) + "%";
    }


    // ==========================================================
    // LIMITA PERCENTUAL VISUAL
    // ==========================================================

    function limitarPercentual(
      valor
    ) {

      let numero =
        Number(valor) || 0;

      if (
        numero < 0
      ) {
        numero = 0;
      }

      if (
        numero > 100
      ) {
        numero = 100;
      }

      return numero;
    }


    // ==========================================================
    // ESCAPA HTML
    // ==========================================================

    function escaparHTML(
      valor
    ) {

      return String(
        valor ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    // ==========================================================
    // DETERMINA STATUS
    // ==========================================================

    function determinarStatus(
      item
    ) {

      const meta =
        Number(item.meta) || 0;

      const produzido =
        Number(item.produzido) || 0;

      if (
        meta <= 0
      ) {

        return {
          classe: "",
          texto: "SEM META"
        };

      }

      if (
        produzido >= meta
      ) {

        return {
          classe: "concluido",
          texto: "CONCLUÍDO"
        };

      }

      if (
        produzido > 0
      ) {

        return {
          classe: "andamento",
          texto: "EM PRODUÇÃO"
        };

      }

      return {
        classe: "atrasado",
        texto: "AGUARDANDO"
      };

    }


    // ==========================================================
    // CRIA CARD
    // ==========================================================

    function criarCard(
      item,
      indice
    ) {

      item =
        item || {};

      const numero =
        Number(
          item.item
        ) || (
          indice + 1
        );

      const produto =
        String(
          item.produto || ""
        ).trim();

      const lote =
        String(
          item.lote || ""
        ).trim();

      const meta =
        Number(
          item.meta
        ) || 0;

      const produzido =
        Number(
          item.produzido
        ) || 0;

      const pendente =
        Math.max(
          Number(
            item.pendente
          ) || (
            meta -
            produzido
          ),
          0
        );

      const percentual =
        Number(
          item.percentual
        ) || (
          meta > 0
            ? (
                produzido /
                meta
              ) * 100
            : 0
        );

      const percentualVisual =
        limitarPercentual(
          percentual
        );

      const status =
        determinarStatus(
          item
        );

      const produtoHTML =
        produto !== ""
          ? escaparHTML(
              produto
            )
          : "Aguardando item";

      const loteHTML =
        lote !== ""
          ? "Lote: " +
            escaparHTML(
              lote
            )
          : "Lote: --";

      const classeProduto =
        produto !== ""
          ? ""
          : "vazio";

      const graus =
        percentualVisual *
        3.6;

      let corStatus =
        "#506b82";

      if (
        status.classe ===
        "concluido"
      ) {

        corStatus =
          "#3bd17f";

      } else if (
        status.classe ===
        "andamento"
      ) {

        corStatus =
          "#f2b84b";

      } else if (
        status.classe ===
        "atrasado"
      ) {

        corStatus =
          "#e95d67";
      }

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "card " +
        status.classe;

      card.innerHTML = `

        <div class="card-topo">

          <div class="numero">
            ${numero}
          </div>

          <div class="status">
            ${status.texto}
          </div>

        </div>

        <div
          class="produto ${classeProduto}"
          title="${produtoHTML}"
        >
          ${produtoHTML}
        </div>

        <div
          class="lote"
          title="${loteHTML}"
        >
          ${loteHTML}
        </div>

        <div class="conteudo-card">

          <div class="circulo-area">

            <div
              class="circulo"
              style="
                background:
                conic-gradient(
                  ${corStatus}
                  0deg
                  ${graus}deg,
                  #1a2b3b
                  ${graus}deg
                  360deg
                );
              "
            >

              <div class="percentual">
                ${formatarPercentual(percentual)}
              </div>

            </div>

          </div>

          <div class="numeros">

            <div class="linha-numero">

              <span class="linha-label">
                Produzido
              </span>

              <span class="linha-valor">
                ${formatarNumero(produzido)}
              </span>

            </div>

            <div class="linha-numero">

              <span class="linha-label">
                Meta
              </span>

              <span class="linha-valor">
                ${formatarNumero(meta)}
              </span>

            </div>

            <div class="linha-numero">

              <span class="linha-label">
                Pendente
              </span>

              <span class="linha-valor">
                ${formatarNumero(pendente)}
              </span>

            </div>

          </div>

        </div>

        <div class="barra-container">

          <div
            class="barra"
            style="
              width: ${percentualVisual}%;
              background: ${corStatus};
            "
          ></div>

        </div>

      `;

      return card;
    }


    // ==========================================================
    // GARANTE OS 10 ITENS
    // ==========================================================

    function normalizarItens(
      itensRecebidos
    ) {

      const lista =
        Array.isArray(
          itensRecebidos
        )
          ? itensRecebidos
          : [];

      const resultado = [];

      for (
        let i = 0;
        i < 10;
        i++
      ) {

        const item =
          lista[i] || {};

        resultado.push({

          item:
            Number(
              item.item
            ) || (
              i + 1
            ),

          produto:
            item.produto || "",

          lote:
            item.lote || "",

          produzido:
            Number(
              item.produzido
            ) || 0,

          meta:
            Number(
              item.meta
            ) || 0,

          pendente:
            Number(
              item.pendente
            ) || 0,

          percentual:
            Number(
              item.percentual
            ) || 0

        });

      }

      return resultado;
    }


    // ==========================================================
    // DESENHA OS 10 CARDS
    // ==========================================================

    function renderizarItens(
      itens
    ) {

      const lista =
        normalizarItens(
          itens
        );

      const fragmento =
        document.createDocumentFragment();

      lista.forEach(
        function(
          item,
          indice
        ) {

          fragmento.appendChild(
            criarCard(
              item,
              indice
            )
          );

        }
      );

      elementos.itens.innerHTML = "";

      elementos.itens.appendChild(
        fragmento
      );
    }


    // ==========================================================
    // ATUALIZA RESUMO
    // ==========================================================

    function renderizarResumo(
      resumo,
      itens
    ) {

      resumo =
        resumo || {};

      let metaTotal =
        Number(
          resumo.metaTotal
        );

      let produzidoTotal =
        Number(
          resumo.produzidoTotal
        );

      let pendenteTotal =
        Number(
          resumo.pendenteTotal
        );

      let progressoGeral =
        Number(
          resumo.progressoGeral
        );

      if (
        !isFinite(metaTotal)
      ) {

        metaTotal = 0;

        itens.forEach(
          function(item) {

            metaTotal +=
              Number(
                item.meta
              ) || 0;

          }
        );
      }

      if (
        !isFinite(produzidoTotal)
      ) {

        produzidoTotal = 0;

        itens.forEach(
          function(item) {

            produzidoTotal +=
              Number(
                item.produzido
              ) || 0;

          }
        );
      }

      if (
        !isFinite(pendenteTotal)
      ) {

        pendenteTotal =
          Math.max(
            metaTotal -
            produzidoTotal,
            0
          );
      }

      if (
        !isFinite(progressoGeral)
      ) {

        progressoGeral =
          metaTotal > 0
            ? (
                produzidoTotal /
                metaTotal
              ) * 100
            : 0;
      }

      elementos.metaTotal.textContent =
        formatarNumero(
          metaTotal
        );

      elementos.produzidoTotal.textContent =
        formatarNumero(
          produzidoTotal
        );

      elementos.pendenteTotal.textContent =
        formatarNumero(
          pendenteTotal
        );

      elementos.progressoGeral.textContent =
        formatarPercentual(
          progressoGeral
        );
    }


    // ==========================================================
    // STATUS DE CONEXÃO
    // ==========================================================

    function definirStatus(
      tipo,
      texto
    ) {

      elementos.statusBolinha.className =
        "";

      if (
        tipo === "ok"
      ) {

        elementos.statusBolinha.classList.add(
          "ok"
        );

      }

      if (
        tipo === "carregando"
      ) {

        elementos.statusBolinha.classList.add(
          "carregando"
        );

      }

      elementos.statusTexto.textContent =
        texto;
    }


    // ==========================================================
    // MOSTRA ERRO
    // ==========================================================

    function mostrarErro(
      mensagem
    ) {

      elementos.erroTexto.textContent =
        mensagem;

      elementos.erro.classList.add(
        "visivel"
      );
    }


    // ==========================================================
    // ESCONDE ERRO
    // ==========================================================

    function esconderErro() {

      elementos.erro.classList.remove(
        "visivel"
      );
    }


    // ==========================================================
    // PROCESSA DADOS RECEBIDOS
    // ==========================================================

    function processarDados(
      resultado
    ) {

      if (
        !resultado ||
        resultado.sucesso !== true
      ) {

        throw new Error(
          resultado &&
          resultado.erro
            ? resultado.erro
            : "Resposta inválida da API"
        );
      }

      const itens =
        normalizarItens(
          resultado.itens
        );

      renderizarItens(
        itens
      );

      renderizarResumo(
        resultado.resumo,
        itens
      );

      elementos.data.textContent =
        resultado.data ||
        "--";

      elementos.ultimaAtualizacao.textContent =
        resultado.atualizacao
          ? "Atualizado: " +
            resultado.atualizacao
          : "Atualizado agora";

      definirStatus(
        "ok",
        "Conectado • dados atualizados"
      );

      esconderErro();
    }


    // ==========================================================
    // CARREGA DADOS VIA JSONP
    // ==========================================================

    function carregarDadosReais() {

      definirStatus(
        "carregando",
        "Atualizando dados..."
      );

      const callbackName =
        "__pacoteCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );

      const script =
        document.createElement(
          "script"
        );

      let finalizado = false;

      const timeout =
        setTimeout(
          function() {

            finalizar(
              new Error(
                "Tempo limite ao consultar o servidor."
              )
            );

          },
          TEMPO_LIMITE_MS
        );


      function limpar() {

        clearTimeout(
          timeout
        );

        script.remove();

        try {

          delete window[
            callbackName
          ];

        } catch (erro) {

          window[
            callbackName
          ] = undefined;
        }
      }


      function finalizar(
        erro
      ) {

        if (
          finalizado
        ) {
          return;
        }

        finalizado = true;

        limpar();

        if (
          erro
        ) {

          console.error(
            "Erro ao carregar painel:",
            erro
          );

          definirStatus(
            "",
            "Erro de conexão • tentando novamente"
          );

          mostrarErro(
            "Não foi possível atualizar os dados. " +
            "O painel tentará novamente automaticamente."
          );

          setTimeout(
            esconderErro,
            3000
          );
        }
      }


      window[
        callbackName
      ] =
        function(
          resultado
        ) {

          if (
            finalizado
          ) {
            return;
          }

          finalizado = true;

          limpar();

          try {

            processarDados(
              resultado
            );

          } catch (
            erro
          ) {

            console.error(
              "Erro ao processar dados:",
              erro
            );

            definirStatus(
              "",
              "Erro de conexão • tentando novamente"
            );

            mostrarErro(
              erro.message ||
              "Resposta inválida da API."
            );

            setTimeout(
              esconderErro,
              3000
            );
          }

        };


      script.async = true;

      script.onerror =
        function() {

          finalizar(
            new Error(
              "Não foi possível acessar a API."
            )
          );

        };


      script.src =
        URL_API +
        "?painel=" +
        encodeURIComponent(
          SETOR
        ) +
        "&callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&_=" +
        Date.now();

      document.body.appendChild(
        script
      );
    }


    // ==========================================================
    // INICIALIZAÇÃO
    // ==========================================================

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        carregarDadosReais();

        setInterval(
          carregarDadosReais,
          INTERVALO_MS
        );

      }
    );

  </script>

</body>
